<style>
:root{
  --ink:#16202B; --ink-2:#1F2B38; --ink-text:#C9D3DD; --ink-dim:#7F8E9C;
  --paper:#ECEFF3; --panel:#FFFFFF; --panel-2:#F6F8FA; --line:#D6DCE3; --line-2:#E6EAEF;
  --text:#1B2733; --muted:#5C6A78; --steel:#2B5A86; --steel-2:#E3ECF5; --steel-ink:#fff;
  --red:#C8382E; --red-bg:#FBE9E7; --amber:#C98500; --amber-bg:#FCF3DD; --green:#1E8A5A; --green-bg:#E3F4EC;
  --r-lg:12px; --r:8px; --r-sm:6px;
  --shadow:0 1px 2px rgba(22,32,43,.06),0 4px 16px rgba(22,32,43,.06);
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fn:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#0C1218; --ink-2:#16202B; --paper:#10171F; --panel:#18222D; --panel-2:#1D2935; --line:#2A3745; --line-2:#223040;
  --text:#E2E8EE; --muted:#95A3B1; --steel:#6FA3D6; --steel-2:#1E3248; --steel-ink:#0C1218;
  --red:#EF6B61; --red-bg:#3A1F1D; --amber:#E9B03C; --amber-bg:#3A2F17; --green:#46C08A; --green-bg:#173327;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#0C1218; --ink-2:#16202B; --paper:#10171F; --panel:#18222D; --panel-2:#1D2935; --line:#2A3745; --line-2:#223040;
  --text:#E2E8EE; --muted:#95A3B1; --steel:#6FA3D6; --steel-2:#1E3248; --steel-ink:#0C1218;
  --red:#EF6B61; --red-bg:#3A1F1D; --amber:#E9B03C; --amber-bg:#3A2F17; --green:#46C08A; --green-bg:#173327;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--text);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--steel)}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.num,.mono{font-family:var(--fn);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{background:var(--ink);color:var(--ink-text);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand img,.brand .mark{width:34px;height:34px;border-radius:8px;object-fit:contain;background:#fff;flex:none}
.brand .mark{display:grid;place-items:center;background:var(--steel);color:#fff;font-weight:700}
.brand b{display:block;color:#fff;font-size:15px;line-height:1.2}
.brand small{color:var(--ink-dim);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r);color:var(--ink-text);text-decoration:none;font-size:14.5px}
.nav a:hover{background:var(--ink-2)}
.nav a.on{background:var(--ink-2);color:#fff;box-shadow:inset 3px 0 0 var(--steel)}
.nav svg{width:19px;height:19px;flex:none;opacity:.85}
.nav .sep{height:1px;background:var(--ink-2);margin:10px 6px}
.nav .badge{margin-left:auto}
.side .who{border-top:1px solid var(--ink-2);padding:12px 8px 0;font-size:13px;display:flex;gap:10px;align-items:center}
.side .who button{margin-left:auto;background:none;border:1px solid var(--ink-2);color:var(--ink-text);border-radius:var(--r-sm);padding:4px 8px;cursor:pointer;font-size:12px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--steel);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line-2)}
.top h1{font-size:21px;margin:0;font-weight:650;letter-spacing:-.01em}
.top .sub{font-size:13px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.gsearch{position:relative;width:min(340px,34vw)}
.gsearch input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.gsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;opacity:.55}
.gresults{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:40}
.gresults a{display:block;padding:9px 12px;border-bottom:1px solid var(--line-2);text-decoration:none;color:var(--text);font-size:14px}
.gresults a:hover{background:var(--panel-2)}
.gresults small{color:var(--muted);display:block}
.iconbtn{position:relative;width:40px;height:40px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:19px;height:19px}
.iconbtn .dot{position:absolute;top:5px;right:5px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;font-weight:600}
.view{padding:24px 28px 60px;max-width:1480px;width:100%}
.lede{color:var(--muted);margin:-6px 0 18px;max-width:72ch;font-size:14px}

/* ---------- mobile ---------- */
.mbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:12px 16px}
  .top h1{font-size:18px}
  .gsearch{display:none}
  .gsearch.open{display:block;position:fixed;left:12px;right:12px;top:calc(62px + env(safe-area-inset-top,0px));width:auto;z-index:50}
  .view{padding:16px 14px 110px}
  .mbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .mbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;padding:4px 0;position:relative}
  .mbar a.on{color:var(--steel);font-weight:600}
  .mbar svg{width:22px;height:22px}
  .mbar .badge{position:absolute;top:0;right:calc(50% - 22px)}
  .only-desk{display:none!important}
}
@media (min-width:901px){.only-mob{display:none!important}}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:550;font-size:14px;text-decoration:none;color:var(--text);white-space:nowrap;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.wa{color:#128C4B}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11.5px;font-weight:650;background:var(--red);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:550;background:var(--panel-2);border:1px solid var(--line-2);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.chip.nodot::before{display:none}
.chip.red{color:var(--red);background:var(--red-bg);border-color:transparent}
.chip.amber{color:var(--amber);background:var(--amber-bg);border-color:transparent}
.chip.green{color:var(--green);background:var(--green-bg);border-color:transparent}
.chip.steel{color:var(--steel);background:var(--steel-2);border-color:transparent}
.panel{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.panel>header{display:flex;align-items:center;gap:10px;padding:14px 18px 0}
.panel>header h3{margin:0;font-size:15px;font-weight:650}
.panel>header p{margin:0;color:var(--muted);font-size:13px}
.panel .body{padding:14px 18px 18px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* ---------- toolbar / filters ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .search{flex:1 1 240px;max-width:380px;position:relative}
.toolbar .search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.toolbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;opacity:.55}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;padding:6px 12px;border-radius:5px;cursor:pointer;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--steel-2);color:var(--steel);font-weight:600}
.sel{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);max-width:220px;min-height:40px}

/* ---------- table (cards on phones) ---------- */
.tablewrap{overflow-x:auto;border-radius:var(--r-lg)}
table.dt{width:100%;border-collapse:collapse;font-size:14px}
.dt th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;background:var(--panel);position:sticky;top:0}
.dt th.sorted{color:var(--steel)}
.dt td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.dt tbody tr{cursor:pointer}
.dt tbody tr:hover td{background:var(--panel-2)}
.dt td.r,.dt th.r{text-align:right}
.dt .lamp{width:4px;padding:0}
.dt .lamp i{display:block;width:4px;height:28px;border-radius:2px;background:var(--line)}
.lamp.red i{background:var(--red)}.lamp.amber i{background:var(--amber)}.lamp.green i{background:var(--green)}
.dt td .t{font-weight:550}
.dt td small{display:block;color:var(--muted);font-size:12.5px}
.more{display:flex;justify-content:center;padding:14px;gap:10px;align-items:center;color:var(--muted);font-size:13px}
@media (max-width:700px){
  .tablewrap{overflow:visible}
  table.dt,.dt tbody{display:block}
  .dt thead{display:none}
  .dt tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 12px 12px 16px;margin-bottom:10px;position:relative}
  .dt td{border:0;padding:0;font-size:13.5px;min-width:0}
  .dt td::before{content:attr(data-label);display:block;font-size:11.5px;color:var(--muted)}
  .dt td.first{grid-column:1/-1;font-size:15px}
  .dt td.first::before{display:none}
  .dt td.r{text-align:left}
  .dt td.lamp{position:absolute;left:0;top:10px;bottom:10px}
  .dt td.lamp::before{display:none}
  .dt td.lamp i{height:100%;border-radius:0 2px 2px 0}
  .dt td.hide-m{display:none}
  .dt td.acts{grid-column:1/-1}
  .dt td.acts::before{display:none}
}

/* ---------- dashboard ---------- */
.dash-head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:stretch;margin-bottom:18px}
.andon{display:flex;gap:14px;align-items:center;background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:16px 22px 16px 16px}
.stack{display:flex;flex-direction:column;gap:4px;padding:6px;background:#0A0F14;border-radius:8px}
.stack a{width:88px;height:44px;border-radius:5px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;text-decoration:none;color:rgba(255,255,255,.4);font-weight:700;font-size:21px;font-family:var(--fn);background:#1b232c}
.stack a small{font-size:10.5px;font-weight:600;font-family:var(--f);letter-spacing:.02em}
.stack a.lit.red{background:#D8413A;color:#fff;box-shadow:0 0 18px rgba(216,65,58,.55)}
.stack a.lit.amber{background:#E3A21A;color:#231800;box-shadow:0 0 18px rgba(227,162,26,.5)}
.stack a.lit.green{background:#22A06B;color:#fff;box-shadow:0 0 18px rgba(34,160,107,.45)}
.andon .msg b{display:block;font-size:19px;line-height:1.25;max-width:22ch}
.andon .msg span{color:#A9B6C3;font-size:13px}
.andon .msg .btn{margin-top:10px;background:transparent;color:#fff;border-color:#3A4755}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--line)}
.kpi span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font:650 26px/1.2 var(--fn);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi small{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}
.chartbox{position:relative;height:260px}
@media (max-width:1100px){.dash-head{grid-template-columns:1fr}.grid2,.grid3{grid-template-columns:1fr}}
@media (max-width:520px){.andon{flex-direction:column;align-items:stretch}.stack{flex-direction:row}.stack a{flex:1;width:auto}}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.feed li:last-child{border:0}
.feed time{color:var(--muted);font-size:12px;white-space:nowrap;margin-left:auto}

/* ---------- alerts ---------- */
.alert{display:grid;grid-template-columns:6px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px 12px 0;margin-bottom:8px;overflow:hidden}
.alert>i{align-self:stretch;margin:-12px 0}
.alert.red>i{background:var(--red)}.alert.amber>i{background:var(--amber)}.alert.info>i{background:var(--steel)}
.alert b{font-weight:600}
.alert p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.alert .row{justify-content:flex-end}
@media (max-width:700px){.alert{grid-template-columns:6px 1fr}.alert .row{grid-column:2;justify-content:flex-start}}
.group-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.group-h h3{margin:0;font-size:15px}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:60;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);z-index:61;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18);animation:slide .2s ease-out;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer>header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.drawer>header h2{margin:0;font-size:18px;flex:1}
.drawer .content{flex:1;overflow:auto;padding:18px 20px 30px}
.drawer>footer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line-2);background:var(--panel-2)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:88vh;overflow:auto;background:var(--panel);border-radius:var(--r-lg);z-index:62;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin:0 0 6px;font-size:18px}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- forms ---------- */
.fgroup{margin-bottom:22px}
.fgroup>h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line-2);padding-bottom:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.field label{display:block;font-size:13px;font-weight:550;margin-bottom:5px}
.field label em{color:var(--red);font-style:normal}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);min-height:40px}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--steel);outline:none;box-shadow:0 0 0 3px var(--steel-2)}
.field .hint{font-size:12px;color:var(--muted);margin-top:4px}
.field .computed{padding:9px 11px;border-radius:var(--r-sm);background:var(--panel-2);border:1px dashed var(--line);font-family:var(--fn);font-weight:600;min-height:40px}
.field.bad input,.field.bad select{border-color:var(--red)}
.field .warn{color:var(--amber);font-size:12px;margin-top:4px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:500;cursor:pointer;margin:0}
.checks input{width:auto;min-height:0}
.switch{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px}
.switch input{width:auto;min-height:0}

/* ---------- toast ---------- */
.toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100% - 24px))}
@media (max-width:900px){.toasts{left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--ink);color:#fff;border-radius:var(--r);padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;animation:fade .2s}
.toast.err{background:var(--red)}
.toast .btn{background:#fff;color:#16202B;border:0;min-height:32px;padding:5px 10px;font-size:13px}
.toast .x{margin-left:auto;background:none;border:0;color:#fff;opacity:.7;cursor:pointer;font-size:18px}

/* ---------- notifications panel ---------- */
.npanel{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:16px;width:min(400px,calc(100% - 24px));max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 20px 40px rgba(0,0,0,.18);z-index:55}
.npanel header{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--panel)}
.npanel header b{flex:1}
.nitem{display:block;padding:11px 14px;border-bottom:1px solid var(--line-2);text-decoration:none;color:var(--text);font-size:13.5px}
.nitem.unread{background:var(--steel-2)}
.nitem small{color:var(--muted);display:block}

/* ---------- welcome / login ---------- */
.gate{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.gate .art{background:var(--ink);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.gate .art h1{font-size:clamp(30px,4vw,48px);line-height:1.08;margin:0;font-weight:700;letter-spacing:-.02em;max-width:15ch}
.gate .art p{color:#A9B6C3;max-width:44ch}
.gate .art .stack{flex-direction:row;align-self:flex-start;margin-bottom:26px}
.gate .art .stack a{width:64px;height:16px}
.gate .form{padding:56px;display:flex;flex-direction:column;justify-content:center;max-width:560px;width:100%;margin:0 auto}
.gate .form h2{margin:0 0 6px;font-size:24px}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-lg);padding:18px;margin-top:12px;cursor:pointer}
.choice:hover{border-color:var(--steel)}
.choice b{display:block;font-size:16px}
.choice span{color:var(--muted);font-size:14px}
@media (max-width:860px){.gate{grid-template-columns:1fr}.gate .art{padding:32px 22px}.gate .form{padding:28px 20px}}

/* ---------- settings ---------- */
.settings{display:grid;grid-template-columns:220px 1fr;gap:20px}
.stabs{display:flex;flex-direction:column;gap:2px}
.stabs button{text-align:left;border:0;background:none;padding:9px 12px;border-radius:var(--r);cursor:pointer;color:var(--muted);font-size:14px}
.stabs button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
@media (max-width:900px){.settings{grid-template-columns:1fr}.stabs{flex-direction:row;overflow-x:auto}.stabs button{white-space:nowrap}}
.listed{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.listed .chip{padding:4px 6px 4px 10px}
.listed .chip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;padding:0 4px}
pre.code{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow:auto;max-height:260px;font-size:12px}
.steps{padding-left:20px}
.steps li{margin-bottom:10px}
.progress{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--steel);width:0;transition:width .2s}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

/* ---------- workflow additions ---------- */
.nav .sep{height:auto;background:none;margin:12px 10px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}

.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:0 0 18px}
.flow a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line-2);text-decoration:none;color:var(--text);min-width:0;position:relative}
.flow a:hover{border-color:var(--steel)}

.opchips{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.opchips .arr{font-style:normal;color:var(--muted);font-size:12px;margin:0 1px}
.opchip{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 5px;border-radius:5px;font:600 11px/1 var(--fn);letter-spacing:.02em;border:1px solid transparent;cursor:default}
.opchip.done{background:var(--green);color:#fff}
.opchip.green{background:var(--steel-2);color:var(--steel);border-color:var(--steel)}
.opchip.amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber)}
.opchip.red{background:var(--red);color:#fff}

.legend{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:6px}

.lampdot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.lampdot.big{width:16px;height:16px}
.lampdot.amber{background:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
.lampdot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-bg);animation:pulse 1.6s infinite}
.lampdot.done{background:var(--muted);box-shadow:none}

.stepper{list-style:none;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:0;margin:18px 0 12px;counter-reset:s}
.stepper li{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:var(--r);cursor:pointer;border-top:3px solid var(--line);min-width:0}

.stepper li b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);color:var(--muted);font-size:12px;flex:none}
.stepper li span{font-size:13px;font-weight:600;min-width:0}
.stepper li small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper li.done{border-top-color:var(--green)}.stepper li.done b{background:var(--green);color:#fff}
.stepper li.now{border-top-color:var(--steel);background:var(--steel-2)}.stepper li.now b{background:var(--steel);color:var(--steel-ink)}

@media (max-width:520px){.stepper{grid-template-columns:repeat(2,1fr)}}
.nextup{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--panel-2);border:1px dashed var(--steel)}
.nextup span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);font-weight:700}
.nextup b{flex:1;min-width:180px}
.kpis.wide{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi.static{cursor:default}
.kpi.warn b{color:var(--red)}
.kpi small .chip{font-size:11px;padding:0 6px}
.oboard{display:flex;flex-direction:column}
.orow{display:flex;gap:12px;align-items:center;padding:10px 4px;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;cursor:pointer;width:100%}
.orow:hover{background:var(--panel-2)}
.orow .grow{flex:1;min-width:0}.orow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.orow small{color:var(--muted);font-size:12.5px}

@media (max-width:600px){.orow .pcell{display:none}}
.duel{list-style:none;margin:0;padding:0}
.duel li{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line-2);cursor:pointer}

.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.wcard{background:var(--panel);border:1px solid var(--line-2);border-left:4px solid var(--green);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column}
.wcard.amber{border-left-color:var(--amber)}.wcard.red{border-left-color:var(--red)}.wcard.done{border-left-color:var(--muted);opacity:.8}
.wcard header{display:flex;gap:8px;align-items:center;padding:12px 14px 0}
.wcard header time{font-size:12.5px;color:var(--muted)}
.wcard.red header time{color:var(--red);font-weight:600}
.wbody{padding:8px 14px}
.wproc{font-size:17px;font-weight:650;display:flex;gap:8px;align-items:center}

.wbody small{display:block;color:var(--muted);font-size:12.5px}

.tboard details{margin-bottom:10px}
details.panel>summary{display:flex;gap:10px;align-items:center;padding:14px 16px;cursor:pointer;list-style:none;flex-wrap:wrap}

details.panel[open]>summary::after{content:"▴"}
.trk{margin-bottom:14px}
.trk>header{display:flex;gap:12px;align-items:center;padding:14px 18px 0;flex-wrap:wrap}
.trk-h{text-decoration:none;color:var(--text);min-width:0}.trk-h b{display:block}.trk-h small{color:var(--muted)}
.trkt td{vertical-align:middle}
.needgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.need{border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;background:var(--panel-2)}
.need b{display:block}.need span{display:block;font-size:14px}.need small{display:block;color:var(--muted);font-size:12.5px}
table.dt th.sel,table.dt td.sel{width:34px;padding-right:0}
table.dt td.sel input{width:18px;height:18px}
input.cell,select.cell{width:100%;min-width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel)}
input.cell.num{text-align:right;max-width:110px}
.iconbtn.sm{width:30px;height:30px}.iconbtn.sm svg{width:14px;height:14px}
.sepv{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
table.lines td{vertical-align:middle}
table.lines td small{display:block;color:var(--muted);font-size:12px}
.route tr.isdone td{opacity:.65}
.ell{display:block;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hub-head .body{padding:18px 20px}
html,body{overflow-x:clip;max-width:100%}.main,.view{min-width:0;max-width:100vw}canvas{max-width:100%!important}

<script>
/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const num = v => { if (v === null || v === undefined || v === '') return null; if (typeof v === 'number') return isFinite(v) ? v : null; const t = String(v).replace(/[^0-9.\-]/g, ''); if (!/\d/.test(t)) return null; const n = Number(t); return isFinite(n) ? n : null; };
const round = (n, d = 2) => n == null ? null : Math.round(n * 10 ** d) / 10 ** d;
const pad = n => String(n).padStart(2, '0');
const isoDate = d => d ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` : '';
const today = () => isoDate(new Date());
const parseD = s => { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return y ? new Date(y, m - 1, d) : null; };
const daysBetween = (a, b) => { const x = parseD(a), y = parseD(b); return x && y ? Math.round((y - x) / 864e5) : null; };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return isoDate(d); };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtD = s => { const d = parseD(s); return d ? `${pad(d.getDate())} ${MONTHS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}` : '—'; };
const fmtN = (n, d = 0) => n == null || n === '' ? '—' : Number(n).toLocaleString('en-IN', { maximumFractionDigits: d, minimumFractionDigits: 0 });
const money = n => n == null ? '—' : (S.settings.currency || '') + fmtN(n, 0);
const moneyShort = n => { if (n == null) return '—'; const c = S.settings.currency || ''; const a = Math.abs(n); if (a >= 1e7) return c + fmtN(n / 1e7, 2) + ' Cr'; if (a >= 1e5) return c + fmtN(n / 1e5, 2) + ' L'; if (a >= 1e3) return c + fmtN(n / 1e3, 1) + 'k'; return c + fmtN(n, 0); };
const ago = ts => { if (!ts) return ''; const s = (Date.now() - new Date(ts)) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; if (s < 7 * 86400) return Math.floor(s / 86400) + 'd ago'; return fmtD(isoDate(new Date(ts))); };
const initials = n => (String(n || '').replace(/\(.*?\)/g, '').replace(/[^\p{L}\p{N}\s]/gu, '').trim().split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('') || '?').toUpperCase();
const titleCase = s => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const uniq = a => [...new Set(a.filter(v => v !== null && v !== undefined && v !== ''))];
const norm = s => String(s ?? '').trim().toLowerCase();
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.warn(e); } };

/* ================= app state ================= */
const S = {
  mode: null,          // 'local' | 'cloud'
  cfg: null,
  session: null, profile: null,
  settings: {},
  data: {},
  route: 'dashboard', params: {},
  ui: lsGet('cpt_ui', {}),
};
const saveUI = () => lsSet('cpt_ui', S.ui);

const TABLES = ['app_settings', 'team', 'masters', 'suppliers', 'customers', 'materials', 'orders', 'parts', 'purchase_orders', 'grns', 'operations', 'tasks', 'notifications', 'activity'];
const WORK_TABLES = ['team', 'suppliers', 'customers', 'materials', 'orders', 'parts', 'purchase_orders', 'grns', 'operations', 'tasks'];

const DEFAULT_SETTINGS = {
  company_name: '', app_title: 'Child Parts Tracker', logo: '', currency: '₹', country_code: '91',
  due_soon_days: 2, order_warn_days: 7, alert_lookback_days: 120, default_credit_days: 30,
  weight_factor: 0.00000786, fy_start_month: 4, company_address: '', company_gst: '',
  emailjs: { service_id: '', template_id: '', public_key: '' },
  whatsapp_auto: true, digest_auto: true, digest_last: '', app_url: '', default_role: 'none', stuck_days: 7,
  login_email: true, login_username: true, notif_all: true, notif_email: true, notif_whatsapp: true, notif_push: true, vapid_public: ''
};

/* Starter options — created once so a fresh workspace is usable. All editable in Settings → Lists. */
const STARTER_MASTERS = [
  ['inspection', 'OK'], ['inspection', 'Not OK'], ['inspection', 'Rework'],
  ['part_type', 'Plate'], ['part_type', 'Rod'], ['part_type', 'Hex rod'], ['part_type', 'Std'],
];
const MASTER_CATS = {
  process: { label: 'Processes', hint: 'Every machining / treatment step. Hour rate or rate per part fills the process cost plan automatically.', extra: [['hour_rate', 'Hour rate', 'number'], ['rate_per_part', 'Rate / part', 'number'], ['in_house', 'In-house', 'bool']] },
  part_type: { label: 'Part types', hint: 'Types containing "rod" or "hex" use the diameter for weight.' },
  inspection: { label: 'Inspection results', hint: 'Options for inspection on each process.' },
  hold_reason: { label: 'Hold reasons', hint: 'Why a process is on hold, e.g. Waiting for drawing, Machine breakdown.' },
  team_tag: { label: 'Team “Works as” roles', hint: 'The tick-boxes on the Team form. Keep “Manager” (daily digest) and “Planner” — other parts of the app look for those names.' },

const opPayable = op => op.owner_type !== 'Supplier' || op.status !== 'Done' ? 0 : Math.max(0, (num(op.bill_amount) ?? ((computeRow('operations', op).actual_cost ?? computeRow('operations', op).plan_cost ?? 0) - (num(op.debit_amount) || 0))) - (num(op.paid_amount) || 0));

const recentCut = () => addDays(today(), -(num(S.settings.alert_lookback_days) || 120));

const liveOp = op => { if (op.status === 'Done') return false; const o = op.order_id ? orderById(op.order_id) : null; if (o) return !ORDER_DONE.has(o.status); if (op.order_id) return false; return (op.sent_date || op.start_date || op.target_date || '') >= recentCut(); };

/* ================= alerts engine ================= */
function computeAlerts() {
  const out = [], t = today(), from = recentCut();
  for (const o of S.data.orders || []) {
    if (ORDER_DONE.has(o.status)) continue;
    const l = orderLight(o);
    if (o.delivery_date && o.delivery_date < t) out.push({ lvl: 'red', kind: 'orders', rec: o, title: `Order ${o.order_no} is ${daysBetween(o.delivery_date, t)} day(s) past delivery date`, text: `${o.project} · ${o.customer || ''} · ${orderProgress(o).pct}% complete` });
    else if (l === 'amber' && o.delivery_date && daysBetween(t, o.delivery_date) <= (num(S.settings.order_warn_days) ?? 7)) out.push({ lvl: 'amber', kind: 'orders', rec: o, title: `Order ${o.order_no} due for delivery ${fmtD(o.delivery_date)}`, text: `${o.project} · ${orderProgress(o).pct}% complete` });
  }
  for (const op of S.data.operations || []) {
    if (num(op.rejection_qty) > 0 && (op.done_date || '') >= addDays(t, -30)) out.push({ lvl: 'amber', kind: 'operations', rec: op, title: `${fmtN(op.rejection_qty)} rejected on ${op.drawing_no}`, text: `${ownerName(op)} · debit ${money(num(op.debit_amount))}` });
    if (!liveOp(op)) continue;
    const l = opLight(op), who = `${op.part_name || ''} · ${op.process || ''} · ${ownerName(op)}`;
    if (l === 'red') out.push({ lvl: 'red', kind: 'operations', rec: op, title: `${op.drawing_no} ${op.process || ''} is ${daysBetween(op.target_date, t)} day(s) late`, text: `${who} · target ${fmtD(op.target_date)}` });
    else if (l === 'amber') out.push({ lvl: 'amber', kind: 'operations', rec: op, title: op.status === 'On hold' ? `${op.drawing_no} ${op.process || ''} is on hold` : `${op.drawing_no} ${op.process || ''} due ${op.target_date === t ? 'today' : fmtD(op.target_date)}`, text: who + (op.hold_reason ? ' · ' + op.hold_reason : '') });
  }
  for (const po of S.data.purchase_orders || []) {
    if (!['Sent', 'Partly received'].includes(po.status)) continue;
    if (po.expected_date && po.expected_date < t) out.push({ lvl: 'red', kind: 'purchase_orders', rec: po, title: `RM on ${po.po_no} is ${daysBetween(po.expected_date, t)} day(s) late`, text: `${po.supplier} · expected ${fmtD(po.expected_date)}` });
  }
  for (const m of S.data.materials || []) if (num(m.min_stock_kg) && (num(m.stock_kg) || 0) < num(m.min_stock_kg)) out.push({ lvl: 'amber', kind: 'materials', rec: m, title: `${m.grade} stock low: ${fmtN(m.stock_kg, 1)} kg`, text: `Minimum ${fmtN(m.min_stock_kg)} kg` });
  for (const p of S.data.parts || []) {
    const o = orderById(p.order_id); if (!o || ORDER_DONE.has(o.status)) continue;
    if (rmStage(p) === 'To buy' && o.delivery_date && daysBetween(t, o.delivery_date) <= 14) out.push({ lvl: 'amber', kind: 'parts', rec: p, title: `RM not ordered for ${p.drawing_no}`, text: `${o.order_no} delivery ${fmtD(o.delivery_date)}` });
  }
  for (const k of S.data.tasks || []) {
    if (k.status === 'Done') continue;
    const m = teamById(k.assigned_to);
    if (k.due_date && k.due_date < t) out.push({ lvl: 'red', kind: 'tasks', rec: k, title: `Task overdue: ${k.title}`, text: `${m?.name || 'Unassigned'} · due ${fmtD(k.due_date)}` });
    else if (k.due_date && daysBetween(t, k.due_date) <= 1) out.push({ lvl: 'amber', kind: 'tasks', rec: k, title: `Task due ${k.due_date === t ? 'today' : 'tomorrow'}: ${k.title}`, text: m?.name || 'Unassigned' });
  }
  for (const o of S.data.orders || []) { const c = computeRow('orders', o); if (c.outstanding > 0 && o.invoice_date && addDays(o.invoice_date, num(o.credit_days) ?? num(S.settings.default_credit_days) ?? 30) < t) out.push({ lvl: 'amber', kind: 'orders', rec: o, title: `Payment overdue from ${o.customer || 'customer'}: ${money(c.outstanding)}`, text: `${o.invoice_no || 'Invoice'} · ${o.order_no}` }); }
  const seen = {}, dups = [];
  for (const p of S.data.parts || []) { const k = norm(p.drawing_no) + '|' + (p.order_id || ''); if (!p.drawing_no) continue; if (seen[k]) dups.push(p.drawing_no); seen[k] = 1; }
  if (dups.length) out.push({ lvl: 'info', kind: 'dup', title: `${uniq(dups).length} drawing number(s) appear twice in the same order`, text: uniq(dups).slice(0, 6).join(', ') + (uniq(dups).length > 6 ? '…' : '') });
  return out;
}

  },
  async remove(t, ids) { const set = new Set(ids); S.data[t] = S.data[t].filter(x => !set.has(x.id)); this.persist(t); },
  async patchMany(t, rows) { const now = new Date().toISOString(); const m = new Map(rows.map(r => [r.id, r])); S.data[t].forEach(x => { if (m.has(x.id)) Object.assign(x, m.get(x.id), { updated_at: now }); }); this.persist(t); },

let sb = null;
const Cloud = {
  async load(t) {
    let q = () => sb.from(t).select('*');
    if (t === 'notifications') {
      const me = norm(S.profile?.email);
      const { data, error } = await sb.from(t).select('*').eq('recipient_email', me).order('created_at', { ascending: false }).limit(200);
      if (error) throw error; return data;
    }
    if (t === 'activity') { const { data, error } = await sb.from(t).select('*').order('created_at', { ascending: false }).limit(300); if (error) throw error; return data; }
    const out = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await q().range(from, from + 999);
      if (error) throw error; out.push(...data); if (data.length < 1000) break;
    }
    return out;
  },
  upsertCache(t, row) { const a = S.data[t]; const i = a.findIndex(x => x.id === row.id); if (t === 'team' && S.hasSecrets && i >= 0 && !row.wa_apikey) row.wa_apikey = a[i].wa_apikey; if (i >= 0) a[i] = row; else a.push(row); dirtyIdx(); },
  async insert(t, rows, onProgress) {
    const out = [];
    if (t === 'notifications') {
      const now = new Date().toISOString(); rows = rows.map(r => ({ id: uid(), created_at: now, ...r }));
      const { error } = await sb.from(t).insert(rows); if (error) throw error;
      rows.filter(r => norm(r.recipient_email) === norm(S.profile?.email)).forEach(r => this.upsertCache(t, r));
      return rows;
    }
    for (let i = 0; i < rows.length; i += 400) {
      const { data, error } = await sb.from(t).insert(rows.slice(i, i + 400)).select();
      if (error) throw error; out.push(...data); data.forEach(r => this.upsertCache(t, r));
      onProgress && onProgress(Math.min(i + 400, rows.length), rows.length);
    }
    return out;
  },
  async update(t, id, patch) {
    const { data, error } = await sb.from(t).update({ ...patch, updated_at: new Date().toISOString() }).eq('id', id).select().single();
    if (error) throw error; this.upsertCache(t, data); return data;
  },
  async patchMany(t, rows) {
    const now = new Date().toISOString();
    if (!canEdit()) { // members only have UPDATE rights on their own rows — upsert would need INSERT and fail silently
      let err = null;
      for (const { id, ...p } of rows) { try { await this.update(t, id, p); } catch (e) { err = err || e; } }
      if (err) throw err; return;
    }
    for (let i = 0; i < rows.length; i += 400) {
      const { data, error } = await sb.from(t).upsert(rows.slice(i, i + 400).map(r => ({ ...r, updated_at: now }))).select();
      if (error) throw error; data.forEach(r => this.upsertCache(t, r));
    }
  },
  async remove(t, ids) {
    for (let i = 0; i < ids.length; i += 200) {
      const { error } = await sb.from(t).delete().in('id', ids.slice(i, i + 200)); if (error) throw error;
    }
    const set = new Set(ids); S.data[t] = S.data[t].filter(x => !set.has(x.id));
  },
  async setSetting(key, value) {
    const { error } = await sb.from('app_settings').upsert({ key, value, updated_at: new Date().toISOString() }); if (error) throw error;
    const a = S.data.app_settings; const r = a.find(x => x.key === key); if (r) r.value = value; else a.push({ key, value });
  },
  subscribe() {
    sb.channel('cpt-all').on('postgres_changes', { event: '*', schema: 'public' }, p => {
      const t = p.table; if (!S.data[t]) return; dirtyIdx();
      if (t === 'team_secrets') { const a = S.data.team_secrets, id = (p.new && p.new.team_id) || (p.old && p.old.team_id); const i = a.findIndex(x => x.team_id === id); if (p.eventType === 'DELETE') { if (i >= 0) a.splice(i, 1); const tm = teamById(id); if (tm) tm.wa_apikey = null; } else { i >= 0 ? a[i] = p.new : a.push(p.new); } mergeSecrets(); return; }
      if (p.eventType === 'DELETE') S.data[t] = S.data[t].filter(x => x.id !== p.old.id && (t !== 'app_settings' || x.key !== p.old.key));
      else if (t === 'app_settings') { const a = S.data.app_settings; const i = a.findIndex(x => x.key === p.new.key); i >= 0 ? a[i] = p.new : a.push(p.new); applySettings(); }
      else if (t === 'notifications' && norm(p.new.recipient_email) !== norm(S.profile?.email)) return;
      else this.upsertCache(t, p.new);
      if (t === 'notifications' && p.eventType === 'INSERT') toast(`🔔 ${p.new.title}`);
      liveRefresh();
    }).subscribe();
  },
};
const DB = {
  get a() { return S.mode === 'cloud' ? Cloud : Local; },
  canWrite(table) {
    const role = myRole();
    if (role === 'admin' || role === 'editor') return true;

    return false;
  },
  get secretKeys() { return S.mode === 'cloud' && S.hasSecrets; },
  async insert(t, rows, onProgress) {
    rows = (Array.isArray(rows) ? rows : [rows]).map(r => coerce(t, r));
    if (S.mode === 'cloud' && S.session && ['orders', 'parts', 'operations', 'purchase_orders', 'grns', 'tasks'].includes(t)) rows.forEach(r => r.created_by ??= S.profile?.email);
    try {
      if (t === 'team' && this.secretKeys) { // CallMeBot keys live in an editors-only table, not on the team row everyone can read
        rows.forEach(r => { r.id ??= uid(); }); const keys = rows.filter(r => r.wa_apikey).map(r => [r.id, r.wa_apikey]); rows.forEach(r => { r.wa_apikey = null; });
        const out = await this.a.insert(t, rows, onProgress); await saveKeys(keys); return out;
      }
      return await this.a.insert(t, rows, onProgress);
    } finally { dirtyIdx(); }
  },
  async update(t, id, patch) {

      return await this.a.update(t, id, patch);
    } finally { dirtyIdx(); }
  },
  async remove(t, ids) { try { return await this.a.remove(t, Array.isArray(ids) ? ids : [ids]); } finally { dirtyIdx(); } },
  async patchMany(t, rows) { try { return await this.a.patchMany(t, rows.map(r => coerce(t, r))); } finally { dirtyIdx(); } },
  async setSetting(k, v) { return this.a.setSetting(k, v); },
};

    if (error) throw error;

// Invite token: carries the database address + public key so a new device joins by just opening a link (no code editing).
const wsToken = () => (S.mode === 'cloud' && S.cfg?.url && !window.APP_CONFIG) ? btoa(JSON.stringify({ u: S.cfg.url, k: S.cfg.key })).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') : '';

const appLink = route => { const b = appBase(); if (!b) return ''; const t = wsToken(); return b + (t ? '?ws=' + t : '') + (route ? '#/' + route : ''); };
function readInvite(str) {
  try { const m = String(str).match(/[?&]ws=([A-Za-z0-9_-]+)/); if (!m) return null; const j = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))); return /^https:\/\//.test(j.u) && j.k ? { mode: 'cloud', url: j.u, key: j.k } : null; } catch (e) { return null; }
}
function waNumber(phone) {

  if (!d) return '';
  const cc = String(S.settings.country_code || '').replace(/\D/g, '');

const waLink = (phone, text) => `https://wa.me/${waNumber(phone)}?text=${encodeURIComponent(text)}`;

async function notify(member, { title, body = '', route = '' }, opts = {}) {
  if (!member) return;

  const sent = [], manual = [];

    else manual.push({ label: 'Email', href: mailLink(member.email, title, full) });

    else manual.push({ label: 'WhatsApp', href: waLink(member.phone, full), wa: 1 });

  return { sent, manual };
}

function digestText() {
  const al = computeAlerts(); const red = al.filter(a => a.lvl === 'red'), amb = al.filter(a => a.lvl === 'amber');
  const openOrders = (S.data.orders || []).filter(o => !ORDER_DONE.has(o.status)).length, openOps = (S.data.operations || []).filter(o => o.status !== 'Done').length;
  const lines = [`Daily status — ${fmtD(today())}`, `Open orders: ${openOrders} · Open processes: ${openOps}`, `Overdue: ${red.length} · Needs attention: ${amb.length}`];
  if (red.length) { lines.push('', 'Overdue:'); red.slice(0, 10).forEach(a => lines.push('• ' + a.title)); }
  if (amb.length) { lines.push('', 'Needs attention:'); amb.slice(0, 8).forEach(a => lines.push('• ' + a.title)); }
  return lines.join('\n');
}
async function sendDigest(manual = false) {
  const mgrs = teamBy('Manager');
  if (!mgrs.length) { if (manual) toast('Tag at least one team member as "Manager" to receive the digest.', [{ label: 'Open team', route: 'team' }]); return; }
  const body = digestText();
  for (const m of mgrs) await notify(m, { title: `${S.settings.company_name || 'Parts tracker'} — daily digest`, body, route: 'alerts' }, { silent: !manual });

}

async function migrateV1() {
  const oj = lsGet('cpt_t_jobs', null), og = lsGet('cpt_t_grinding', null);
  if (!oj && !og) return;
  const P = { parts: [], jobs: oj || [], grinding: og || [], suppliers: [], team: [], tasks: [], masters: [] };
  // old grade list → RM master; old internal processes → process master
  const oldM = S.data.masters || [];
  for (const m of oldM.filter(m => m.category === 'grade')) P.masters.push({ category: '_grade', value: m.value, extra: m.extra || {} });
  for (const m of oldM.filter(m => m.category === 'internal_process')) P.masters.push({ category: 'process', value: m.value, extra: { in_house: true } });
  const closedSet = new Set(oldM.filter(m => m.category === 'job_status' && m.extra?.closed).map(m => norm(m.value)));
  await buildWorkflowFromLegacy(P, closedSet, () => { });
  localStorage.removeItem('cpt_t_jobs'); localStorage.removeItem('cpt_t_grinding');
  const keep = oldM.filter(m => !['grade', 'internal_process', 'job_status', 'rm_status'].includes(m.category));

/* ================= reminders: near / past target, completion ================= */
async function scanReminders() {
  if (!canEdit() && myRole() !== 'member') return;
  const t = today(), soon = num(S.settings.due_soon_days) ?? 2, patches = [], opatches = [];
  const planner = op => teamByName(op.assigned_by) || teamById(orderById(op.order_id)?.owner);
  let n = 0;
  for (const op of S.data.operations || []) {
    if (op.status === 'Done' || !op.target_date) continue;
    if (op.order_id && ORDER_DONE.has(orderById(op.order_id)?.status)) continue; // closed / imported history — never remind
    if (!canEdit() && op.owner_member !== me().team?.id) continue;
    const lvl = op.target_date < t ? 'late' : daysBetween(t, op.target_date) <= soon ? 'soon' : '';
    if (!lvl || op.alert_state === lvl) continue;
    if (lvl === 'late' && (op.target_date < recentCut())) { patches.push({ id: op.id, alert_state: lvl }); continue; }
    const title = lvl === 'late' ? `LATE: ${op.drawing_no} ${op.process || ''} passed target ${fmtD(op.target_date)}` : `Due ${op.target_date === t ? 'today' : fmtD(op.target_date)}: ${op.drawing_no} ${op.process || ''}`;
    const body = `${op.part_name || ''} · qty ${fmtN(op.qty)} · ${ownerName(op)} · status ${op.status}${op.project ? '\n' + op.project : ''}`;
    const rec = uniqBy([op.owner_type === 'Supplier' ? teamById(op.follow_up) : teamById(op.owner_member), planner(op)].filter(Boolean), x => x.id);
    for (const m of rec) { await notify(m, { title, body, route: 'mywork' }, { silent: true }); n++; }
    patches.push({ id: op.id, alert_state: lvl, alert_date: t });
  }
  if (canEdit()) for (const o of S.data.orders || []) {
    if (ORDER_DONE.has(o.status) || !o.delivery_date) continue;
    const lvl = o.delivery_date < t ? 'late' : daysBetween(t, o.delivery_date) <= (num(S.settings.order_warn_days) ?? 7) ? 'soon' : '';
    if (!lvl || o.alert_state === lvl) continue;
    const m = teamById(o.owner) || null;
    if (m && o.delivery_date >= recentCut()) { await notify(m, { title: `${lvl === 'late' ? 'DELIVERY LATE' : 'Delivery due ' + fmtD(o.delivery_date)}: ${o.order_no} ${o.project}`, body: `${o.customer || ''} · ${orderProgress(o).pct}% complete`, route: 'order?id=' + o.id }, { silent: true }); n++; }
    opatches.push({ id: o.id, alert_state: lvl });
  }
  try { if (patches.length) await DB.patchMany('operations', patches); if (opatches.length) await DB.patchMany('orders', opatches); } catch (e) { console.warn('reminders', e); }
  if (n) toast(`${n} reminder${n > 1 ? 's' : ''} sent for work that is due or late.`, [{ label: 'See alerts', route: 'alerts' }], 7000);
}
const uniqBy = (a, f) => { const s = new Set(); return a.filter(x => { const k = f(x); if (s.has(k)) return false; s.add(k); return true; }); };

function toast(msg, actions = [], ms = 4200, err = false) {

  el.innerHTML = `<span>${esc(msg)}</span>${actions.map((a, i) => a.href ? `<a class="btn ${a.wa ? 'wa' : ''}" href="${esc(a.href)}" target="_blank" rel="noopener">${a.wa ? ICON.wa : ''}${esc(a.label)}</a>` : `<button class="btn" data-i="${i}">${esc(a.label)}</button>`).join('')}<button class="x" aria-label="Dismiss">×</button>`;
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-i]'); if (b) { const a = actions[+b.dataset.i]; a.route ? go(a.route) : a.onClick?.(); el.remove(); }
    if (e.target.closest('.x')) el.remove();

}

      if (st === 'In progress') fill('start_date', d);
      if (st === 'At supplier') fill('sent_date', d);
    }
    if (e.isTrusted && auto[k]) delete auto[k];
    refresh();
  });
  form.addEventListener('change', refresh);
  refresh();

}

/** Generic record editor for any table in SCHEMA. */
function openRecord(table, rec = null, opts = {}) {
  const isNew = !rec?.id;
  const base = { ...(rec || {}) };
  if (isNew) for (const f of SCHEMA[table]) if (f.def && base[f.key] == null) base[f.key] = f.def();
  if (table === 'operations') base.owner = ownerKey(base);
  const writable = canEdit() || (!isNew && myRole() === 'member' && ((table === 'tasks' && rec.assigned_to === me().team?.id) || (table === 'operations' && [rec.owner_member, rec.follow_up].includes(me().team?.id))));
  const names = REC_NAMES;
  const title = isNew ? `New ${names[table]}` : (opts.title || (table === 'operations' ? `${rec.drawing_no} · ${rec.process || 'process'}` : table === 'orders' ? `${rec.order_no} · ${rec.project}` : rec.drawing_no || rec.title || rec.name || rec.grade || 'Edit'));
  const extras = !isNew && opts.extraActions ? opts.extraActions(rec) : '';
  const d = openDrawer(title, formHtml(table, base) + (extras ? `<div class="row" style="margin-top:4px">${extras}</div>` : ''),
    writable ? `${!isNew && canEdit() ? `<button class="btn danger" data-del>Delete</button>` : ''}<span class="spacer"></span><button class="btn" data-cancel>Cancel</button><button class="btn pri" data-save>${isNew ? 'Save ' + names[table] : 'Save changes'}</button>`
      : `<span class="muted">You have view-only access.</span><span class="spacer"></span><button class="btn" data-cancel>Close</button>`);
  const form = $('#recform', d);
  if (!writable) $$('input,select,textarea', form).forEach(x => x.disabled = true);
  wireForm(form, table, base);
  if (table === 'team') addContactMask(form);
  d.querySelector('[data-cancel]').onclick = closeOverlay;
  form.addEventListener('submit', e => { e.preventDefault(); d.querySelector('[data-save]')?.click(); });
  d.querySelector('[data-del]')?.addEventListener('click', async () => {
    if (!(await confirmBox(`Delete this ${names[table]}?`, 'This removes it for everyone and cannot be undone.'))) return;
    try { await DB.remove(table, rec.id); await logActivity('deleted', table, rec, `${names[table]} ${title}`); toast(`Deleted ${names[table]}.`); render(); } catch (e) { fail(e, 'Delete failed'); }
  });
  d.querySelector('[data-save]')?.addEventListener('click', async ev => {
    const raw = readForm(form, table); let bad = false;
    for (const f of SCHEMA[table]) { const box = form.querySelector(`[data-field="${f.key}"]`); const miss = f.req && (raw[f.key] == null || raw[f.key] === '' || (Array.isArray(raw[f.key]) && !raw[f.key].length)); box?.classList.toggle('bad', !!miss); if (miss) bad = true; }
    if (bad) { toast('Fill in the fields marked with *', [], 3000, true); form.querySelector('.bad input,.bad select')?.focus(); return; }
    if (raw.location_url && !safeUrl(raw.location_url)) { form.querySelector('[data-field="location_url"]')?.classList.add('bad'); toast('The map link must start with https://', [], 3500, true); return; }
    const row = computeRow(table, raw);
    if (table === 'operations') { if (rec._part_id || base._part_id) { row.part_id = rec._part_id || base._part_id; row.order_id = rec._order_id ?? base._order_id ?? row.order_id; } else if (!rec.part_id) { const p = partByDrg(row.drawing_no); if (p) { row.part_id = p.id; row.order_id = p.order_id; } } if (isNew) row.assigned_by = me().name; if ((row.owner_member || row.supplier) && row.status === 'Planned') row.status = 'Assigned'; if (row.status === 'Done') row.progress = 100; if (rec.target_date !== row.target_date || rec.status !== row.status) row.alert_state = null; }
    if (table === 'parts' && row.order_id && !row.project) row.project = orderById(row.order_id)?.project || null;
    if (table === 'tasks' && row.status === 'Done' && rec?.status !== 'Done') row.completed_at = new Date().toISOString();
    ev.target.disabled = true;
    try {
      let saved;
      if (isNew) [saved] = await DB.insert(table, row); else saved = await DB.update(table, rec.id, row);
      await logActivity(isNew ? 'added' : 'updated', table, saved, `${names[table]} ${saved.order_no || saved.po_no || saved.drawing_no || saved.title || saved.name || saved.grade || ''}${table === 'operations' ? ' ' + (saved.process || '') + ' → ' + saved.status : ''}`);
      closeOverlay(); render();
      await afterSave(table, saved, isNew ? {} : rec);
      opts.onSaved?.(saved);
      if (!S._toasted) toast(isNew ? `Saved ${names[table]}.` : 'Changes saved.'); S._toasted = false;
    } catch (e) { ev.target.disabled = false; fail(e, 'Save failed'); }
  });
  return d;
}

/* Who to notify after a save */
const REC_NAMES = { orders: 'order', parts: 'part', materials: 'material', purchase_orders: 'purchase order', grns: 'GRN', operations: 'process step', suppliers: 'supplier', customers: 'customer', team: 'team member', tasks: 'task' };
async function afterSave(table, rec, before) {
  const who = me().name;
  if (table === 'tasks' && rec.assigned_to && (rec.assigned_to !== before.assigned_to)) {
    S._toasted = true;
    const m = teamById(rec.assigned_to), to = memberLogin(m);
    const ok = await notifyInApp(to, { title: `New task from ${who}: ${rec.title}`, body: `${rec.priority || 'Normal'} priority${rec.due_date ? ' · due ' + fmtD(rec.due_date) : ''}${rec.drawing_no ? ' · drawing ' + rec.drawing_no : ''}${rec.details ? '\n' + rec.details : ''}`, route: 'mywork?tab=tasks', team: m?.id });
    toast(ok ? `${m.name} notified in the app.` : `Task saved. ${m?.name || 'That person'} has no app login yet, so no notification was sent — add an email or username for them on the Team page.`, [], 7000, !ok);
  }
  if (table === 'tasks' && before.id && (rec.status !== before.status || (rec.details || '') !== (before.details || ''))) {
    const to = norm(rec.created_by); // whoever assigned the task
    if (to && to !== norm(S.profile?.email)) {
      S._toasted = true;
      const what = rec.status === 'Done' ? 'Task done' : rec.status !== before.status ? `Task ${rec.status.toLowerCase()}` : 'Task updated';
      await notifyInApp(to, { title: `${what}: ${rec.title}`, body: `${who} ${rec.status !== before.status ? 'set it to ' + rec.status : 'added an update'}${rec.details && rec.details !== before.details ? '\n' + rec.details : ''}`, route: 'mywork?tab=tasks' });
    }
  }
  if (table === 'operations') await afterOpSave(rec, before);
}
async function afterOpSave(op, before) {
  const who = me().name, detail = `${op.part_name || ''} · qty ${fmtN(op.qty)}${op.project ? '\n' + op.project : ''}${op.target_date ? '\nTarget: ' + fmtD(op.target_date) : ''}`;
  const planner = teamByName(op.assigned_by) || teamById(orderById(op.order_id)?.owner);
  const assignChanged = ownerKey(op) && ownerKey(op) !== ownerKey(before);
  if (assignChanged) {
    S._toasted = true;
    if (op.owner_type === 'In-house') await notify(teamById(op.owner_member), { title: `New work for you: ${op.process || 'process'} on ${op.drawing_no}`, body: `Assigned by ${who}\n${detail}`, route: 'mywork' });
    else {
      await notifySupplier(op.supplier, `${S.settings.company_name || 'Job work'}: ${op.process || 'process'} for ${op.drawing_no}`, `Part: ${op.part_name || ''}\nQty: ${fmtN(op.qty)}\nRequired by: ${fmtD(op.target_date)}${op.plan_rate ? '\nRate: ' + money(op.plan_rate) + ' per part' : ''}\nPlease confirm.`);
      if (op.follow_up && op.follow_up !== me().team?.id) await notify(teamById(op.follow_up), { title: `Follow up ${op.supplier}: ${op.drawing_no} ${op.process || ''}`, body: detail, route: 'mywork' }, { silent: true });
    }
  }
  if (op.status !== before.status && before.status && ['Done', 'On hold'].includes(op.status) && planner && planner.id !== me().team?.id) {
    S._toasted = true;
    const nx = op.status === 'Done' ? opsOfPart(partById(op.part_id) || { id: '-', drawing_no: op.drawing_no }).find(o => o.status !== 'Done' && o.id !== op.id) : null;
    await notify(planner, { title: op.status === 'Done' ? `Completed: ${op.drawing_no} ${op.process || ''}` : `ON HOLD: ${op.drawing_no} ${op.process || ''}`, body: `${ownerName(op)} · updated by ${who}${op.hold_reason && op.status === 'On hold' ? '\nReason: ' + op.hold_reason : ''}${op.status === 'Done' ? (op.done_date && op.target_date ? `\n${op.done_date <= op.target_date ? 'On time' : daysBetween(op.target_date, op.done_date) + ' day(s) late'}` : '') + (nx ? `\nNext: ${nx.process} by ${ownerName(nx)}` : '\nAll steps for this part are done.') : ''}`, route: op.order_id ? 'order?id=' + op.order_id : 'process' });
  }
  if (op.status === 'Done' && before.status !== 'Done' && op.part_id) {
    // wake up the next step's owner
    const nx = opsOfPart(partById(op.part_id) || { id: op.part_id }).find(o => o.status !== 'Done' && o.id !== op.id);
    if (nx && nx.owner_type === 'In-house' && nx.owner_member && nx.owner_member !== me().team?.id) await notify(teamById(nx.owner_member), { title: `Ready for you: ${nx.process} on ${nx.drawing_no}`, body: `Previous step ${op.process || ''} is complete.\nTarget: ${fmtD(nx.target_date)}`, route: 'mywork' }, { silent: true });
  }
}

/* ================= data table ================= */
/**
 * cols: [{key,label,val:(r)=>sortValue, html:(r)=>cell, cls, first, hideM}]
 */
function dataTable(id, rows, cols, { onRow, pageSize = 60, lamp } = {}) {
  const st = S.ui['sort_' + id] || {};
  if (st.key) { const c = cols.find(c => c.key === st.key); if (c) { const v = c.val || (r => r[c.key]); rows = [...rows].sort((a, b) => { const x = v(a), y = v(b); return (x == null) - (y == null) || (x < y ? -1 : x > y ? 1 : 0) * (st.dir || 1); }); } }
  const shown = S.ui['show_' + id] || pageSize;
  const vis = rows.slice(0, shown);
  const html = `<div class="panel tablewrap"><table class="dt" data-dt="${id}"><thead><tr>${lamp ? '<th class="lamp" aria-label="Status"></th>' : ''}${cols.map(c => `<th data-k="${c.key}" class="${c.cls || ''} ${st.key === c.key ? 'sorted' : ''}">${esc(c.label)}${st.key === c.key ? (st.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('')}</tr></thead><tbody>${vis.map((r, i) => `<tr data-i="${i}" tabindex="0">${lamp ? `<td class="lamp ${lamp(r)}"><i></i></td>` : ''}${cols.map(c => `<td data-label="${esc(c.label)}" class="${c.cls || ''} ${c.first ? 'first' : ''} ${c.hideM ? 'hide-m' : ''}">${c.html ? c.html(r) : esc(r[c.key] ?? '—')}</td>`).join('')}</tr>`).join('')}</tbody></table>${rows.length > shown ? `<div class="more">Showing ${vis.length} of ${fmtN(rows.length)} <button class="btn sm" data-more>Show more</button></div>` : `<div class="more">${fmtN(rows.length)} record${rows.length === 1 ? '' : 's'}</div>`}</div>`;
  setTimeout(() => {
    const t = document.querySelector(`[data-dt="${id}"]`); if (!t) return;
    t.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => { const k = th.dataset.k; S.ui['sort_' + id] = { key: k, dir: st.key === k ? -(st.dir || 1) : 1 }; saveUI(); render(); });
    t.querySelectorAll('tbody tr').forEach(tr => {
      const open = e => { if (e.target.closest('a,button')) return; onRow && onRow(vis[+tr.dataset.i]); };
      tr.onclick = open; tr.onkeydown = e => { if (e.key === 'Enter') open(e); };
    });
    t.parentElement.querySelector('[data-more]')?.addEventListener('click', () => { S.ui['show_' + id] = shown + 200; render(); });
  });
  return html;
}

function exportRows(name, rows, table) {
  if (!window.XLSX) return toast('Excel library is still loading — try again in a moment.');
  const fields = SCHEMA[table] || Object.keys(rows[0] || {}).map(k => ({ key: k, label: k }));
  const out = rows.map(r => { const c = computeRow(table, r); const o = {}; for (const f of fields) { let v = c[f.key]; if (f.type === 'member') v = teamById(v)?.name || ''; if (Array.isArray(v)) v = v.join(', '); o[f.label] = v ?? ''; } return o; });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(out), name.slice(0, 30));
  XLSX.writeFile(wb, `${name} ${today()}.xlsx`);
}

  const doneOps = ops.filter(o => o.status === 'Done');
  const lastDone = doneOps.slice().sort((a, b) => (b.done_date || '').localeCompare(a.done_date || ''))[0];
