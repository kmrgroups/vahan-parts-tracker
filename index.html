const DEMO_TABLES = ['masters', 'materials', 'customers', 'suppliers', 'team', 'orders', 'parts', 'purchase_orders', 'grns', 'operations', 'tasks', 'activity'];
const demoCount = () => DEMO_TABLES.reduce((s, t) => s + (S.data[t] || []).filter(r => isDemo(r.id)).length, 0);
const demoLoaded = () => DEMO_TABLES.some(t => (S.data[t] || []).some(r => isDemo(r.id)));

function buildDemo() {
  let n = 0; const id = () => DEMO_PREFIX + '0000-4000-8000-' + (++n).toString(16).padStart(12, '0');
  let seed = 20260926; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(rnd() * a.length)], vary = (v, p) => round(v * (1 + (rnd() * 2 - 1) * p), 2);
  const T = today(), D = k => addDays(T, k), clampPast = d => d > T ? T : d;
  const out = { masters: [], materials: [], customers: [], suppliers: [], team: [], orders: [], parts: [], purchase_orders: [], grns: [], operations: [], tasks: [], activity: [] };
  const hasM = (c, v) => masters(c).some(m => norm(m.value) === norm(v));

  // ---- lists
  const PROC = { 'CNC Turning': { hour_rate: 550, in_house: true }, 'Milling': { rate_per_part: 350 }, 'Heat Treatment': { rate_per_part: 180 }, 'Wire Cut EDM': { rate_per_part: 650 }, 'Surface Grinding': { hour_rate: 450, in_house: true }, 'Cylindrical Grinding': { hour_rate: 500, in_house: true }, 'Blackening': { rate_per_part: 60 }, 'CMM Inspection': { rate_per_part: 250 } };
  Object.entries(PROC).forEach(([v, extra], i) => { if (!hasM('process', v)) out.masters.push({ id: id(), category: 'process', value: v, extra, sort: 20 + i }); });
  [['inspection', 'OK'], ['inspection', 'Rework'], ['inspection', 'Not OK'], ['part_type', 'Plate'], ['part_type', 'Rod'], ['part_type', 'Block'], ['hold_reason', 'Waiting for drawing revision'], ['hold_reason', 'Machine breakdown']].forEach(([c, v], i) => { if (!hasM(c, v)) out.masters.push({ id: id(), category: c, value: v, extra: {}, sort: 40 + i }); });

  // ---- masters
  const MAT = [['EN8', 110, 180, 100, 'Sri Balaji Steels'], ['EN31', 185, 40, 60, 'Metro Alloy Traders'], ['OHNS', 420, 26, 20, 'Metro Alloy Traders'], ['D2', 520, 8, 15, 'Metro Alloy Traders'], ['MS', 92, 320, 150, 'Sri Balaji Steels'], ['SS304', 265, 0, null, 'Sri Balaji Steels']];
  for (const [g, r, st, mn, sp] of MAT) if (!materialByGrade(g)) out.materials.push({ id: id(), grade: g, rate_per_kg: r, stock_kg: st, min_stock_kg: mn, preferred_supplier: sp });
  const CUS = [['Apex Auto Components', 'R. Suresh', 45], ['Sundaram Fixtures & Gauges', 'K. Anand', 30], ['Kaveri Press Tools', 'M. Lakshmi', 60]];
  for (const [nm, cp, cd] of CUS) if (!customerByName(nm)) out.customers.push({ id: id(), name: nm, contact_person: cp, credit_days: cd, address: 'Bengaluru' });
  const SUP = [['Sri Balaji Steels', 'Raw material', 30], ['Metro Alloy Traders', 'Raw material', 45], ['Precision Technology', 'Milling', 30], ['Harisha Industry', 'Heat Treatment', 30], ['FAZ Tooling', 'Wire Cut EDM', 30], ['Unique Measurement Service', 'CMM Inspection', 15], ['Balaji Blackening & Engraving', 'Blackening', 15]];
  for (const [nm, pr, cd] of SUP) if (!supplierByName(nm)) out.suppliers.push({ id: id(), name: nm, process: pr, contact_person: 'Demo contact', credit_days: cd, address: 'Peenya Industrial Area, Bengaluru', active: true });
  const TEAM = [['Karthik (demo)', ['Planner', 'Manager']], ['Murugan (demo)', ['Machine operator']], ['Selvi (demo)', ['Moves parts']], ['Ramesh (demo)', ['Purchase']], ['Priya (demo)', ['Accounts']]];
  const tm = TEAM.map(([nm, tags]) => { const r = { id: id(), name: nm, tags, notify_email: false, notify_whatsapp: false, active: true }; out.team.push(r); return r; });
  const [planner, operator, mover, buyer] = tm;
  const supFor = { 'Milling': 'Precision Technology', 'Heat Treatment': 'Harisha Industry', 'Wire Cut EDM': 'FAZ Tooling', 'CMM Inspection': 'Unique Measurement Service', 'Blackening': 'Balaji Blackening & Engraving' };

  // ---- orders: finished history → live work → just received
  const ORD = [
    { p: 'Welding fixture — lever gear shift', c: 0, od: -150, dd: -110, f: 1, st: 'Closed', del: -112, inv: 1, paid: 1 },
    { p: 'Drill jig — mounting bracket', c: 1, od: -120, dd: -80, f: 1, st: 'Delivered', del: -73, inv: 1, paid: .5 },
    { p: 'Coining press tool OP60', c: 2, od: -95, dd: -50, f: 1, st: 'Delivered', del: -51, inv: 1, paid: 0 },
    { p: 'Checking fixture — wheel hub', c: 0, od: -58, dd: -3, f: .8, st: 'In production' },
    { p: 'Assembly fixture — seat frame', c: 1, od: -36, dd: 6, f: .5, st: 'In production' },
    { p: 'Trim die — side bracket', c: 2, od: -21, dd: 21, f: .2, st: 'In production' },
    { p: 'Gauge set — output shaft', c: 0, od: -5, dd: 32, f: 0, st: 'Open' },
  ];
  const PARTS = [['BASE PLATE', 'Plate', 'MS', [320, 220, 25]], ['LOCATING BLOCK', 'Block', 'EN8', [80, 60, 40]], ['CLAMP ARM', 'Plate', 'EN8', [180, 40, 20]], ['LOCATING PIN', 'Rod', 'EN31', [25, 70]], ['REST PAD', 'Block', 'EN31', [50, 40, 20]], ['PUNCH', 'Rod', 'D2', [32, 90]], ['DIE INSERT', 'Block', 'D2', [120, 80, 35]], ['GUIDE BUSH', 'Rod', 'EN31', [40, 55]], ['SUPPORT PILLAR', 'Rod', 'MS', [45, 160]], ['TOP PLATE', 'Plate', 'MS', [300, 200, 30]], ['STRIPPER PLATE', 'Plate', 'OHNS', [200, 150, 16]], ['STOPPER', 'Block', 'EN8', [40, 30, 25]]];
  const ROUTE = { Plate: ['Milling', 'Heat Treatment', 'Surface Grinding', 'Blackening'], Rod: ['CNC Turning', 'Heat Treatment', 'Cylindrical Grinding'], Block: ['Milling', 'Wire Cut EDM', 'Heat Treatment', 'Surface Grinding', 'CMM Inspection'] };
  const fy = (() => { const t = new Date(), fm = (num(S.settings.fy_start_month) || 4) - 1; const y = t.getMonth() >= fm ? t.getFullYear() : t.getFullYear() - 1; return String(y).slice(2) + String(y + 1).slice(2); })();
  let poN = 0, grnN = 0;
  ORD.forEach((O, oi) => {
    const cust = CUS[O.c][0], oid = id(), no = `DEMO-SO-${fy}-${String(oi + 1).padStart(3, '0')}`;
    const count = 4 + (oi % 3) + (oi === 4 ? 2 : 0), list = [];
    for (let j = 0; j < count; j++) {
      const [nm, type, grade, dims] = PARTS[(oi * 3 + j) % PARTS.length];
      const drg = `DM-${String(24 + oi).padStart(2, '0')}${String(oi + 3).padStart(2, '0')}-01-${String(j + 1).padStart(2, '0')}`;
      const qty = type === 'Rod' ? pick([2, 4, 4, 6]) : pick([1, 1, 2]);
      const p = { id: id(), order_id: oid, project: O.p, drawing_no: drg, ga_drawing_no: `DM-${String(24 + oi).padStart(2, '0')}${String(oi + 3).padStart(2, '0')}-00-00`, part_name: nm, type, grade, qty, order_date: D(O.od), target_date: D(O.dd - 4), rm_source: 'Purchase' };
      if (type === 'Rod') { p.dia = dims[0]; p.length = dims[1]; } else { p.length = dims[0]; p.width = dims[1]; p.thk = dims[2]; }
      Object.assign(p, computeRow('parts', p));
      list.push(p);
    }
    // raw material: PO + GRN
    const rmState = O.f === 0 ? 'none' : O.f < .3 ? 'partial' : 'all';
    if (O.f === 0) { // new order: two parts on a sent PO, the rest still to buy; one from stock
      list[list.length - 1].rm_source = 'From stock'; list[list.length - 1].rm_received_date = D(O.od + 2); list[list.length - 1].actual_weight = list[list.length - 1].planned_weight;
    }
    const buyList = O.f === 0 ? list.slice(0, 2) : list;
    if (buyList.length) {
      const bySup = {}; for (const p of buyList) { const sp = materialByGrade(p.grade)?.preferred_supplier || MAT.find(m => m[0] === p.grade)?.[4] || 'Sri Balaji Steels'; (bySup[sp] ??= []).push(p); }
      for (const [sp, ps] of Object.entries(bySup)) {
        const poId = id(), rate = g => num(materialByGrade(g)?.rate_per_kg) ?? MAT.find(m => m[0] === g)?.[1] ?? 100;
        const lines = ps.map(p => ({ part_id: p.id, drawing_no: p.drawing_no, part_name: p.part_name, grade: p.grade, size: partSize(p), qty: p.qty, weight: round(p.planned_weight * 1.05, 3), rate: rate(p.grade), amount: round(p.planned_weight * 1.05 * rate(p.grade)) }));
        const recvAll = rmState === 'all', recv = recvAll ? ps : rmState === 'partial' ? ps.slice(0, Math.ceil(ps.length / 2)) : [];
        const po = { id: poId, po_no: `DEMO-PO-${fy}-${String(++poN).padStart(3, '0')}`, po_date: D(O.od + 1), supplier: sp, order_id: oid, expected_date: D(O.od + 4), status: recvAll ? 'Received' : recv.length ? 'Partly received' : 'Sent', lines, total: round(lines.reduce((s, l) => s + l.amount, 0)) };
        out.purchase_orders.push(po); ps.forEach(p => { p.po_id = poId; });
        if (recv.length) {
          const gd = D(O.od + (oi === 1 ? 7 : 4)), gl = recv.map(p => { const l = lines.find(x => x.part_id === p.id); const w = round(l.weight * vary(1, .03), 3), r = vary(l.rate, .05); p.actual_weight = w; p.actual_rate = r; p.rm_received_date = gd; Object.assign(p, computeRow('parts', p)); return { ...l, weight: w, rate: r, amount: round(w * r) }; });
          const val = gl.reduce((s, l) => s + l.amount, 0);
          out.grns.push({ id: id(), grn_no: `DEMO-GRN-${fy}-${String(++grnN).padStart(3, '0')}`, grn_date: gd, po_id: poId, supplier: sp, lines: gl, bill_no: `INV-${4100 + grnN}`, bill_date: gd, bill_amount: round(val), credit_days: 30, paid_amount: O.f === 1 ? round(val) : oi === 3 ? round(val) : null, paid_date: O.f === 1 || oi === 3 ? D(O.od + 34) : null });
        }
      }
    }
    // process routes
    for (const [j, p] of list.entries()) {
      if (O.f === 0 && j >= list.length - 2) continue; // newest order: two parts have no route yet
      const route = ROUTE[p.type]; const rmDay = p.rm_received_date ? daysBetween(T, p.rm_received_date) : null;
      // plan each step inside the window between RM receipt and delivery, then let reality drift a little
      const start0 = (rmDay ?? O.od + 5) + 1, end0 = O.dd - 2, span = Math.max(route.length * 2, end0 - start0);
      const w = route.map(pr => PROC[pr].in_house ? 1 : 2), wt = w.reduce((s, x) => s + x, 0);
      let cursor = start0, actual = start0, active = false;
      route.forEach((proc, si) => {
        const pm = PROC[proc], sup = !pm.in_house;
        const pS = Math.round(cursor), pE = Math.round(cursor + span * w[si] / wt); cursor += span * w[si] / wt;
        const op = { id: id(), order_id: oid, part_id: p.id, drawing_no: p.drawing_no, part_name: p.part_name, project: O.p, seq: si + 1, qty: p.qty, process: proc, owner_type: sup ? 'Supplier' : 'In-house', owner_member: sup ? null : operator.id, supplier: sup ? supFor[proc] : null, follow_up: sup ? mover.id : null, assigned_by: planner.name, target_date: D(pE), plan_rate: sup ? pm.rate_per_part : null, plan_hours: sup ? null : round(1.5 + rnd() * 2, 1) };
        const st = Math.max(actual, pS - (rnd() < .3 ? 1 : 0)); // actual start follows the previous step
        const slip = rnd() < .18 ? 1 + Math.floor(rnd() * 5) : rnd() < .35 ? -1 : 0;
        const fin = Math.max(st + 1, pE + slip);
        const canRun = rmDay != null && !active;
        if (canRun && (O.f === 1 || fin <= -1)) {
          op.status = 'Done'; op.progress = 100; op[sup ? 'sent_date' : 'start_date'] = D(Math.min(st, -1)); op.done_date = D(Math.min(fin, -1)); actual = Math.min(fin, -1) + 1;
          if (sup) { op.actual_rate = vary(pm.rate_per_part, .12); } else { op.actual_hours = round(op.plan_hours * vary(1, .25), 2); op.start_time = '09:30'; }
          const bad = rnd() < .12;
          op.inspection = bad ? pick(['Rework', 'Rework', 'Not OK']) : 'OK';
          if (bad) { op.rejection_qty = Math.max(1, Math.round(p.qty * (op.inspection === 'Not OK' ? 1 : .5))); if (sup) op.debit_amount = round(op.rejection_qty * pm.rate_per_part * .5); }
          if (sup) { const c = computeRow('operations', op); op.bill_no = `JW-${1200 + n}`; op.bill_amount = round((c.actual_cost || 0) - (op.debit_amount || 0)); if (O.f === 1 && !(oi === 2 && rnd() < .6)) { op.paid_amount = op.bill_amount; op.paid_date = D(Math.min(fin + 25, -1)); } }
        } else if (canRun && st <= 0) {
          active = true; const r = rnd();
          if (sup) { op.status = 'At supplier'; op.sent_date = D(Math.min(st, 0)); op.progress = 40; }
          else if (r < .15) { op.status = 'On hold'; op.start_date = D(Math.min(st, 0)); op.hold_reason = pick(['Waiting for drawing revision', 'Machine breakdown']); op.progress = 20; }
          else { op.status = 'In progress'; op.start_date = D(Math.min(st, 0)); op.progress = pick([25, 50, 75]); }
        } else { active = true; op.status = rmDay == null && O.f === 0 ? 'Planned' : 'Assigned'; }
        Object.assign(op, computeRow('operations', op)); delete op._hours; delete op.ageing;
        if (op.status !== 'Done' && op.target_date) op.alert_state = op.target_date < T ? 'late' : daysBetween(T, op.target_date) <= (num(S.settings.due_soon_days) ?? 2) ? 'soon' : null;
        out.operations.push(op);
      });
    }
    // order header
    const val = round(list.length * 42000 + oi * 15000, -3);
    const o = { id: oid, order_no: no, order_date: D(O.od), customer: cust, customer_po: `PO/${String(4500 + oi * 37)}`, project: O.p, qty: 1, order_value: val, delivery_date: D(O.dd), owner: planner.id, status: O.st, credit_days: CUS[O.c][2] };
    if (O.del != null) { o.delivered_date = D(O.del); }
    if (O.inv) { o.invoice_no = `DEMO-INV-${String(oi + 1).padStart(3, '0')}`; o.invoice_date = D(O.del); o.invoice_amount = val; o.received_amount = round(val * O.paid) || null; o.received_date = O.paid ? D(O.del + 30) : null; }
    if (!ORDER_DONE.has(O.st)) o.alert_state = o.delivery_date < T ? 'late' : daysBetween(T, o.delivery_date) <= (num(S.settings.order_warn_days) ?? 7) ? 'soon' : null;
    out.orders.push(o); out.parts.push(...list);
  });

  // ---- tasks & activity
  const dOps = out.operations;
  out.tasks.push(
    { id: id(), title: 'Get revised drawing for seat frame locating block', assigned_to: planner.id, assigned_by: 'Demo', due_date: D(-2), priority: 'High', status: 'Open', drawing_no: out.parts.find(p => p.project.includes('seat frame'))?.drawing_no },
    { id: id(), title: 'Chase Harisha Industry for heat treatment lot', assigned_to: mover.id, assigned_by: planner.name, due_date: D(1), priority: 'Urgent', status: 'In progress' },
    { id: id(), title: 'Raise PO for D2 and EN31 (gauge set)', assigned_to: buyer.id, assigned_by: planner.name, due_date: D(2), priority: 'Normal', status: 'Open' },
    { id: id(), title: 'Calibrate surface grinder spindle', assigned_to: operator.id, assigned_by: planner.name, due_date: D(-6), priority: 'Normal', status: 'Done', completed_at: new Date(Date.now() - 7 * 864e5).toISOString() });
  const recent = dOps.filter(o => o.done_date || o.sent_date || o.start_date).sort((a, b) => (b.done_date || b.sent_date || b.start_date).localeCompare(a.done_date || a.sent_date || a.start_date)).slice(0, 10);
  recent.forEach((o, i) => out.activity.push({ id: id(), actor: o.owner_type === 'Supplier' ? mover.name : operator.name, action: 'updated', entity: 'operations', entity_id: o.id, summary: `${o.drawing_no} ${o.process} → ${o.status}`, created_at: new Date(Date.now() - (i * 5 + 1) * 3600e3).toISOString() }));
  return out;
}

async function loadDemo() {
  if (!isAdmin()) return toast('Only admins can load demo data.');
  if (demoLoaded()) return toast('Demo data is already loaded. Remove it first to load a fresh set.');
  if (!(await confirmBox('Load demo data?', `Adds 7 sample orders with child parts, raw material POs and GRNs, process routes at suppliers and in-house, inspections, rejections, bills, tasks and activity — dated around today. ${S.mode === 'cloud' ? 'Everyone signed in will see it. ' : ''}Demo people and suppliers have no phone or email, so no messages go out. Your real data is not changed, and you can remove all demo records in one click.`, 'Load demo data', false))) return;
  const m = openModal(`<h2>Loading demo data…</h2><div class="progress" style="margin-top:14px"><i style="width:3%"></i></div><p class="muted" id="dmsg" style="font-size:13px">Preparing…</p>`);
  try {
    const d = buildDemo(); const steps = DEMO_TABLES.filter(t => d[t].length); let k = 0;
    for (const t of DEMO_TABLES) {
      if (!d[t].length) continue;
      $('#dmsg', m) && ($('#dmsg', m).textContent = `Adding ${REC_NAMES[t] ? REC_NAMES[t] + 's' : t} (${d[t].length})…`);
      await DB.insert(t, d[t]);
      k++; const bar = $('.progress i', m); if (bar) bar.style.width = Math.round(k / steps.length * 100) + '%';
    }
    closeOverlay(); S.ui.dtab = 'overview'; saveUI(); go('dashboard'); render();
    toast(`Demo data loaded: ${d.orders.length} orders, ${d.parts.length} parts, ${d.operations.length} process steps. Remove it any time from the dashboard banner or Settings → Import & backup.`, [], 12000);
  } catch (e) { closeOverlay(); fail(e, 'Demo data stopped part-way — use “Remove demo data” to clean up, then try again'); render(); }
}

async function flushDemo() {
  if (!isAdmin()) return toast('Only admins can remove demo data.');
  if (!(await confirmBox('Remove all demo data?', `Deletes the ${fmtN(demoCount())} demo records (orders, parts, POs, GRNs, process steps, tasks, demo suppliers, customers, team and lists) plus any activity recorded against them. Your real data stays exactly as it is.`, 'Remove demo data'))) return;
  const m = openModal(`<h2>Removing demo data…</h2><p class="muted" id="dmsg" style="font-size:13px">Please wait.</p>`);
  try {
    const demoTeam = new Set((S.data.team || []).filter(r => isDemo(r.id)).map(r => r.id));
    // activity and notifications that point at demo records
    const act = (S.data.activity || []).filter(r => isDemo(r.id) || isDemo(r.entity_id)).map(r => r.id);
    if (act.length) await DB.remove('activity', act);
    if (S.mode === 'cloud') { await sb.from('activity').delete().gte('entity_id', DEMO_PREFIX + '0000-0000-0000-000000000000').lte('entity_id', DEMO_PREFIX + 'ffff-ffff-ffff-ffffffffffff'); }
    const nt = (S.data.notifications || []).filter(r => demoTeam.has(r.recipient_team) || isDemo(r.id)).map(r => r.id);
    if (nt.length) await DB.remove('notifications', nt);
    for (const t of [...DEMO_TABLES].reverse().filter(t => t !== 'activity')) {
      const ids = (S.data[t] || []).filter(r => isDemo(r.id)).map(r => r.id);
      $('#dmsg', m) && ($('#dmsg', m).textContent = `Removing ${t.replace('_', ' ')} (${ids.length})…`);
      if (ids.length) await DB.remove(t, ids);
    }
    // real tasks or steps someone linked to demo items keep working — just drop the dangling link
    const tk = (S.data.tasks || []).filter(t => demoTeam.has(t.assigned_to)).map(t => t.id); if (tk.length) await DB.remove('tasks', tk);
    closeOverlay(); render(); toast('Demo data removed. Your workspace is back to your real data.');
  } catch (e) { closeOverlay(); fail(e, 'Couldn’t remove everything — try again'); render(); }
}

const DTABS = [['overview', 'Overview'], ['prod', 'Production'], ['sup', 'Suppliers'], ['qa', 'Quality'], ['mat', 'Material'], ['age', 'Ageing & stuck'], ['cost', 'Cost'], ['deliv', 'Delivery & cash']];
const OLD_DTAB = { rm: 'mat', proc: 'cost', cust: 'deliv' };
function viewDashboard() {
  let tab = OLD_DTAB[S.ui.dtab] || S.ui.dtab || 'overview'; if (!DTABS.some(d => d[0] === tab)) tab = 'overview';
  const period = S.ui.period || (hasDataIn('fy') ? 'fy' : 'all'), R = periodRange(period);
  const live = ['overview', 'age'].includes(tab);
  const pname = { month: 'this month', '3m': 'last 3 months', fy: 'this FY', lfy: 'last FY', all: 'all time' }[period];

async function updateOp(op, patch, msg) {

    const row = computeRow('operations', { ...op, ...patch });
    const p = { ...patch, alert_state: null }; if (row.status === 'Done') { p.progress = 100; p.done_date ??= today(); }
    const saved = await DB.update('operations', op.id, p);
    await logActivity('updated', 'operations', saved, `${saved.drawing_no} ${saved.process || ''} → ${saved.status}${patch.progress != null && saved.status !== 'Done' ? ' ' + patch.progress + '%' : ''}`);
    render(); S._toasted = false; await afterOpSave(saved, before); if (!S._toasted) toast(msg || 'Updated.'); S._toasted = false;
  } catch (e) { fail(e); }
}

/* ================= tasks (inside My work) ================= */
function viewTasks() {

  const my = me().team?.id;
  let rows = (S.data.tasks || []).filter(t => {
    if (scope === 'mine' && t.assigned_to !== my) return false;
    if (scope === 'byme' && norm(t.created_by) !== norm(S.profile?.email) && norm(t.assigned_by) !== norm(me().name)) return false;
    if (st === 'active' && t.status === 'Done') return false;
    if (st === 'done' && t.status !== 'Done') return false;
    return matchQ(t, q, ['title', 'details', 'drawing_no']) || norm(teamById(t.assigned_to)?.name).includes(norm(q));
  });
  const rank = { red: 0, amber: 1, green: 2, done: 3 }, prank = { Urgent: 0, High: 1, Normal: 2, Low: 3 };
  if (!S.ui.sort_tasks) rows.sort((a, b) => rank[taskLight(a)] - rank[taskLight(b)] || (prank[a.priority] ?? 2) - (prank[b.priority] ?? 2) || (a.due_date || '9').localeCompare(b.due_date || '9'));
  const cols = [
    { key: 'title', label: 'Task', first: 1, html: t => `<span class="t">${esc(t.title)}</span><small>${esc([t.drawing_no, t.assigned_by ? 'from ' + t.assigned_by : ''].filter(Boolean).join(' · '))}</small>` },
    { key: 'assigned_to', label: 'Assigned to', val: t => teamById(t.assigned_to)?.name || '', html: t => esc(teamById(t.assigned_to)?.name || '—') },
    { key: 'due_date', label: 'Due', html: t => `<span class="num">${fmtD(t.due_date)}</span>` },
    { key: 'priority', label: 'Priority', val: t => prank[t.priority], html: t => `<span class="chip ${t.priority === 'Urgent' ? 'red' : t.priority === 'High' ? 'amber' : 'nodot'}">${esc(t.priority || 'Normal')}</span>` },
    { key: 'status', label: 'Status', html: t => lightChip(taskLight(t), t.status) },
    { key: 'acts', label: '', cls: 'acts', html: t => taskQuick(t) },
  ];
  const html = `<div class="toolbar">${seg('tscope', [['mine', 'My tasks'], ['byme', 'Assigned by me'], ...(isAdmin() ? [['all', 'Everyone']] : [])], scope)}${seg('tstatus', [['active', 'Open'], ['done', 'Done'], ['any', 'All']], st)}${searchBox('tasks', 'Search tasks')}<span class="spacer"></span>${addBtn('New task', 'data-newtask')}</div>
  ${rows.length ? dataTable('tasks', rows, cols, { onRow: t => openRecord('tasks', t), lamp: t => taskLight(t) === 'done' ? '' : taskLight(t) }) : `<div class="panel"><div class="empty"><b>No tasks here</b>${canEdit() ? 'Tasks are private: only the person they are given to, the person who gave them, and admins can see a task.' : 'You only see tasks given to you.'}</div></div>`}`;
  const after = () => {
    wireFilters();
    $('[data-newtask]')?.addEventListener('click', () => openRecord('tasks', { assigned_by: me().name }));
    $$('[data-tq]').forEach(b => b.onclick = async e => {
      e.stopPropagation(); const t = S.data.tasks.find(x => x.id === b.dataset.id); const nx = b.dataset.tq;
      try { const before = { ...t }; const saved = await DB.update('tasks', t.id, { status: nx, completed_at: nx === 'Done' ? new Date().toISOString() : null }); await logActivity(nx === 'Done' ? 'completed' : 'started', 'tasks', saved, 'task ' + t.title); render(); await afterSave('tasks', saved, before); S._toasted = false; } catch (err) { fail(err); }
    });

function taskQuick(t) {
  const mine = t.assigned_to && t.assigned_to === me().team?.id;

  const m = teamById(t.assigned_to);
  let h = '';
  if (can && t.status === 'Open') h += `<button class="btn sm" data-tq="In progress" data-id="${t.id}">Start</button>`;
  if (can && t.status !== 'Done') h += `<button class="btn sm" data-tq="Done" data-id="${t.id}">${ICON.check}Done</button>`;
  if (!mine && m?.phone && t.status !== 'Done') h += `<a class="btn sm wa" target="_blank" rel="noopener" href="${esc(waLink(m.phone, `Reminder: ${t.title}${t.due_date ? ' (due ' + fmtD(t.due_date) + ')' : ''}\n${appLink('mywork?tab=tasks')}`))}" aria-label="Nudge on WhatsApp">${ICON.wa}</a>`;
  return `<div class="row" style="flex-wrap:nowrap">${h}</div>`;
}

/* ================= part tracker ================= */
function viewTracker() {
  const anyOpen = (S.data.orders || []).some(o => !ORDER_DONE.has(o.status));

  const oid = S.params.order || S.ui.tr_order || (!anyOpen && latest ? latest.id : ''), q = S.ui.q_tr || '', f = S.ui.tr_f || 'all';
  const orders = (S.data.orders || []).filter(o => oid ? o.id === oid : !ORDER_DONE.has(o.status)).sort((a, b) => (a.delivery_date || '9').localeCompare(b.delivery_date || '9'));

  };
  const blocks = orders.slice(0, oid ? 1 : 25).map(block).join('');

  ${blocks || `<div class="panel"><div class="empty"><b>${(S.data.orders || []).length ? 'Nothing matches' : 'No orders yet'}</b>${(S.data.orders || []).length ? 'Change the filters.' : 'Create an order and add its child parts to start tracking.'}</div></div>`}`;
  const after = () => { wireFilters(); $$('[data-part]').forEach(tr => { const open = () => openRoute(partById(tr.dataset.part)); tr.onclick = open; tr.onkeydown = e => { if (e.key === 'Enter') open(); }; }); };

/* ================= 1. orders ================= */

/* ================= order hub — the whole flow for one order ================= */
function viewOrder() {

  const steps = [['order', 'Order', `due ${fmtD(o.delivery_date)}`], ['rm', 'RM plan', `${parts.length} parts · ${fmtN(kgP, 0)} kg`], ['po', 'Purchase', toBuy.length ? `${toBuy.length} to buy` : 'ordered'], ['grn', 'GRN', `${fmtN(kgA, 0)} kg received`], ['proc', 'Process plan', noRoute.length ? `${noRoute.length} not planned` : `${ops.length} steps`], ['make', 'Production', `${pr.pct}% done`], ['deliver', 'Delivery', o.delivered_date ? fmtD(o.delivered_date) : o.status], ['bill', 'Payment', c.outstanding > 0 ? moneyShort(c.outstanding) + ' due' : o.invoice_amount ? 'received' : 'not invoiced']];
  const firstOpen = steps.findIndex(s => !stDone[s[0]]);
  const next = !parts.length ? ['Add the child parts', 'rm'] : toBuy.length ? [`Raise a purchase order for ${toBuy.length} part(s)`, 'po'] : !stDone.grn ? ['Record material received (GRN)', 'grn'] : noRoute.length ? [`Plan processes for ${noRoute.length} part(s)`, 'proc'] : !stDone.make ? ['Monitor progress — update or chase the late steps', 'make'] : !o.delivered_date ? ['Mark the order delivered', 'deliver'] : !stDone.bill ? ['Invoice and record payment', 'bill'] : ['All done 🎉', ''];
  const cols = [
    { key: 'sel', label: '', cls: 'sel', html: x => canEdit() ? `<input type="checkbox" data-sel="${x.p.id}" aria-label="Select">` : '' },

  <div class="grid2" style="margin-top:16px">

function poMini(list) {

/* paste rows copied from Excel: Drawing no | Part name | Qty | Grade | Type | Dia | L | W | T */
function pasteParts(o) {
  const m = openModal(`<h2>Paste parts from Excel</h2><p class="muted" style="font-size:14px">Copy rows from your drawing BOM and paste below. Column order:<br><code>Drawing no · Part name · Qty · Grade · Type · Dia · L · W · Thk</code> (Dia can be blank for plates).</p><textarea id="pp" style="width:100%;min-height:180px;font-family:var(--fn)" placeholder="VDE-0523-04-00-03	LOCATING BLK	1	EN8	PLATE		230	255	40"></textarea><p class="muted" id="pinfo" style="font-size:13px"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="pc">Cancel</button><button class="btn pri" id="pg">Add parts</button></div>`);
  const parse = () => $('#pp', m).value.split(/\r?\n/).map(l => l.split('\t')).filter(c => c[0] && c[0].trim() && !/drawing/i.test(c[0])).map(c => ({ order_id: o.id, project: o.project, target_date: o.delivery_date, order_date: today(), rm_source: 'Purchase', drawing_no: c[0].trim(), part_name: (c[1] || '').trim() || null, qty: num(c[2]) ?? 1, grade: (c[3] || '').trim().toUpperCase() || null, type: (c[4] || '').trim() || null, dia: num(c[5]), length: num(c[6]), width: num(c[7]), thk: num(c[8]) }));
  $('#pp', m).addEventListener('input', () => { const r = parse(); $('#pinfo', m).textContent = r.length ? `${r.length} part(s) ready · ${fmtN(r.reduce((s, p) => s + (computeRow('parts', p).planned_weight || 0), 0), 1)} kg RM planned` : ''; });
  $('#pc', m).onclick = closeOverlay;

async function useStock(parts) {
  if (!parts.length) return toast('No parts need raw material.');

  const short = Object.entries(byG).filter(([g, kg]) => (num(materialByGrade(g)?.stock_kg) || 0) < kg).map(([g, kg]) => `${g.toUpperCase()}: need ${fmtN(kg, 1)} kg, stock ${fmtN(materialByGrade(g)?.stock_kg || 0, 1)} kg`);
  if (!(await confirmBox(`Issue ${parts.length} part(s) from stock?`, short.length ? `Stock is short — ${short.join('; ')}. Stock will go negative.` : 'Planned weight is taken off the RM stock.', 'Issue from stock', false))) return;
  try {
    await DB.patchMany('parts', parts.map(p => ({ id: p.id, rm_source: 'From stock', rm_received_date: today(), actual_weight: computeRow('parts', p).planned_weight })));
    for (const [g, kg] of Object.entries(byG)) { const m = materialByGrade(g); if (m) await DB.update('materials', m.id, { stock_kg: round((num(m.stock_kg) || 0) - kg, 3) }); }

}

const partSize = p => p.dia ? `Ø${fmtN(p.dia)} × ${fmtN(p.length)}` : [p.length, p.width, p.thk].filter(x => x != null && x !== '').map(fmtN).join(' × ');

    res.orders += rows.length;
  }
  if ([...(P.jobs || []), ...(P.grinding || [])].some(x => !orderFor(x.drawing_no, x.project))) {
    const name = 'Process records without a project (from Excel)'; let o = (S.data.orders || []).find(x => x.project === name);
    if (!o) { [o] = await DB.insert('orders', { order_no: `${fy}-${String((cnt[fy] = (cnt[fy] ?? maxN) + 1)).padStart(3, '0')}`, project: name, qty: 1, status: 'Closed', alert_state: 'late', remarks: 'Rows in PARTS TRACKERS / SG & CG with no project and no recognisable drawing number.' }); res.orders++; }
    catchAll = o.id;
  }
  // drawings that only appear in the process registers get a part record so the tracker can show them
  const missing = new Map();
  for (const x of [...(P.jobs || []), ...(P.grinding || [])]) { if (x._nodrg) continue; const c = (S.data.parts || []).filter(p => norm(p.drawing_no) === norm(x.drawing_no)); if (c.length) continue; const o = orderFor(x.drawing_no, x.project); const k = norm(x.drawing_no) + '|' + (o?.id || ''); if (!missing.has(k)) missing.set(k, { order_id: o?.id || null, drawing_no: x.drawing_no, part_name: x.part_name || null, project: o?.project || clean(x.project), qty: x.qty ?? null, order_date: x.in_date || x.received_date || null, rm_source: null, remarks: 'Created from the process tracker — not in the RM sheet' }); }
  if (missing.size) { log(`Adding ${missing.size} parts found only in the process sheets…`); await DB.insert('parts', [...missing.values()]); }
  res.parts = (res.parts || 0) + missing.size;
  const partFor = (drg, project) => { const c = (S.data.parts || []).filter(p => norm(p.drawing_no) === norm(drg)); return c.find(p => orderById(p.order_id) && pk(orderById(p.order_id).project) === pk(project)) || c.find(p => orderById(p.order_id) && orderById(p.order_id) === orderFor(drg, project)) || c[0] || null; };
  const outTxt = t => { if (!t) return null; const m = /^(\d+)\/([a-z]{3})[a-z]*\/(\d{2})$/i.exec(t); if (m) { let d = +m[1]; if (d > 31 && String(d).endsWith(m[3])) d = +String(d).slice(0, -2); return { done: true, date: d >= 1 && d <= 31 ? xDate(`${d}/${m[2]}/${m[3]}`) : null }; } if (/reject/i.test(t)) return { done: true, date: null, rejected: true }; if (/^1[89]\d\d-/.test(t)) return { done: true, date: null }; return { done: false }; };
  const proc = normProc;
  const ops = [];
  for (const j of P.jobs || []) {
    const p = j._nodrg ? null : partFor(j.drawing_no, j.project), o = p ? orderById(p.order_id) : orderFor(j.drawing_no, j.project);
    const ot = outTxt(j._txt_out_date);
    const done = !!j.out_date || !!ot?.done || closedSet.has(norm(j.status)) || /complete|received|done/i.test(j.status || '');
    if (ot?.done && !j.out_date) j.out_date = ot.date || j.in_date || null;
    const notes = [j.remarks, j._txt_out_date && `Out-date in Excel: “${j._txt_out_date}”`, j._txt_in_date && `In-date in Excel: “${j._txt_in_date}”`, j._txt_qty && `Qty in Excel: “${j._txt_qty}”`, j.pre_inspection && `Pre-inspection: ${j.pre_inspection}`, j.ht && j.ht !== 'No' && `H/T: ${j.ht}`, j.status && `Excel status: ${j.status}`, j._nodrg && 'No drawing no. in Excel'].filter(Boolean);
    j.remarks = notes.join(' · ') || null; if (ot?.rejected) j.final_inspection = 'Rejected';
    ops.push({ order_id: o?.id || null, part_id: p?.id || null, drawing_no: j.drawing_no, part_name: j.part_name || p?.part_name || null, project: clean(j.project) || o?.project || null, qty: j.qty, process: proc(j.process), owner_type: 'Supplier', supplier: j.supplier || null, target_date: j.target_date || null, status: done ? 'Done' : 'At supplier', progress: done ? 100 : 30, sent_date: j.in_date || null, done_date: done ? (j.out_date || j.in_date || null) : null, plan_rate: j.rate ?? null, actual_rate: j.rate ?? null, paid_amount: done && num(j.rate) != null && num(j.qty) != null ? round(Math.max(0, num(j.rate) * num(j.qty) - (num(j.debit_amount) || 0))) : null, inspection: j.final_inspection || null, rejection_qty: j.rejection_qty ?? null, debit_amount: j.debit_amount ?? null, moved_by: j.moved_by || null, remarks: j.remarks || null, alert_state: done ? null : 'late', _d: j.in_date || '' });
  }
  for (const g of P.grinding || []) {
    const p = g._nodrg ? null : partFor(g.drawing_no, g.project), o = p ? orderById(p.order_id) : orderFor(g.drawing_no, g.project), m = teamByName(g.operator);
    g.remarks = [g.remarks, g._txt_received_date && `Received date in Excel: “${g._txt_received_date}”`, g._txt_end_date && `End date in Excel: “${g._txt_end_date}”`, g._txt_qty && `Qty in Excel: “${g._txt_qty}”`, g._nodrg && 'No drawing no. in Excel'].filter(Boolean).join(' · ') || null;
    const done = !!g.end_date;
    ops.push({ order_id: o?.id || null, part_id: p?.id || null, drawing_no: g.drawing_no, part_name: g.part_name || p?.part_name || null, project: clean(g.project) || o?.project || null, qty: g.qty, process: proc(g.process), owner_type: 'In-house', owner_member: m?.id || null, status: done ? 'Done' : 'In progress', progress: done ? 100 : 30, start_date: g.received_date || null, done_date: g.end_date || null, start_time: g.start_time || null, end_time: g.end_time || null, remarks: g.remarks || null, alert_state: done ? null : 'late', _d: g.received_date || '' });
  }
  const key = o => [norm(o.drawing_no), o.owner_type, norm(o.supplier || o.owner_member), norm(o.process), o.sent_date || o.start_date, o.qty].join('|');
  const haveO = new Set((S.data.operations || []).map(key));
  const byPart = {}; for (const o of ops) (byPart[o.part_id || o.drawing_no] ??= []).push(o);
  for (const list of Object.values(byPart)) list.sort((a, b) => a._d.localeCompare(b._d)).forEach((o, i) => { o.seq = i + 1; delete o._d; });
  const newOps = ops.filter(o => !haveO.has(key(o)));
  if (newOps.length) { log(`Saving ${fmtN(newOps.length)} process steps…`, 0); await DB.insert('operations', newOps, (d, n) => log(`Saving process steps: ${fmtN(d)} of ${fmtN(n)}`, d / n)); } res.operations = newOps.length;
  const newTasks = (P.tasks || []); if (newTasks.length) await DB.insert('tasks', newTasks); res.tasks = newTasks.length;
  return res;
}

-- role of the signed-in person: admin | editor | member | viewer
create or replace function app_role() returns text language sql stable security definer set search_path = public as
$$ select case
     when r.role is null then 'none'
     when r.role = 'admin' then 'admin'
     when lower(coalesce(auth.jwt()->>'email','')) like '%@users.vahan.invalid'
          then case when coalesce((select value from app_settings where key = 'login_username'), 'true'::jsonb) = 'true'::jsonb then r.role else 'none' end
     else case when coalesce((select value from app_settings where key = 'login_email'), 'true'::jsonb) = 'false'::jsonb then 'none' else r.role end
   end
   from (select (select role from profiles where id = auth.uid()) as role) r $$;
-- admin-created username accounts sign in as <username>@users.vahan.invalid (no real mailbox)
create or replace function my_team_id() returns uuid language sql stable security definer set search_path = public as
$$ select id from team where lower(email) = lower(auth.jwt()->>'email')
      or (username is not null and lower(username) || '@users.vahan.invalid' = lower(auth.jwt()->>'email')) limit 1 $$;

-- first person to sign up becomes admin; everyone after waits with no access ('none') until an admin gives them a role
create or replace function handle_new_user() returns trigger language plpgsql security definer set search_path = public as $$
begin
  insert into profiles (id, email, full_name, role)
  values (new.id, lower(new.email), coalesce(new.raw_user_meta_data->>'full_name', split_part(new.email, '@', 1)),
          case when (select count(*) from profiles) = 0 then 'admin'
               else coalesce((select value #>> '{}' from app_settings where key = 'default_role' and value #>> '{}' in ('none','editor','member','viewer')), 'none') end)
  on conflict (id) do nothing;
  return new;
end $$;

  from auth.users u on conflict (id) do nothing;

  execute 'create policy "write" on profiles for update to authenticated using (app_role() = ''admin'') with check (app_role() = ''admin'')';
end $$;

/* ================= phone (push) notifications ================= */
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64ToU8 = str => { const pad = '='.repeat((4 - str.length % 4) % 4), raw = atob((str + pad).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...raw].map(c => c.charCodeAt(0))); };
async function enablePush() {
  if (!pushSupported()) return toast('This browser can’t show phone notifications. On iPhone: open the app in Safari → Share → Add to Home Screen, then open it from the Home Screen icon and try again.', [], 12000, true);
  if (!S.settings.vapid_public) return toast('Phone notifications aren’t set up yet. Ask your admin (Settings → Notifications → Phone notifications).', [], 8000, true);
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return toast('Notifications are blocked for this app. Allow them in your phone’s settings, then try again.', [], 9000, true);
    const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(S.settings.vapid_public) });
    const j = sub.toJSON();
    const { error } = await sb.from('push_subscriptions').upsert({ user_email: norm(S.profile.email), endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' });
    if (error) throw error;
    lsSet('cpt_push', 1); toast('Phone notifications are on for this device.'); render();
  } catch (e) { fail(e, 'Couldn’t turn on phone notifications'); }
}
function pushPanel() {
  if (S.mode !== 'cloud' || !S.settings.vapid_public || S.settings.notif_all === false || S.settings.notif_push === false) return '';
  const on = pushSupported() && Notification.permission === 'granted' && lsGet('cpt_push', 0);
  return `<section class="panel" style="padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:200px"><b>Phone notifications</b><small class="muted" style="display:block">${on ? 'On for this device. You’ll be alerted when a task is given to you or updated.' : 'Get an alert on this phone when a task is given to you or updated.'}</small></div>${on ? '<span class="chip green">On</span>' : '<button class="btn pri sm" data-pushon>Turn on</button>'}</section>`;
}
function offerPush() {
  if (S.mode !== 'cloud' || !pushSupported() || !S.settings.vapid_public || S.settings.notif_all === false || S.settings.notif_push === false) return;
  if (Notification.permission !== 'default' || S.ui.pushAsked) return;
  S.ui.pushAsked = 1; saveUI();
  toast('Get an alert on this phone when a task is given to you or updated?', [{ label: 'Turn on', onClick: enablePush }], 14000);
}

function viewSettings() {
  const tabs = [['company', 'Company & look'], ['rules', 'Alert rules'], ['lists', 'Lists'], ['notify', 'Notifications'], ...(S.mode === 'cloud' ? [['access', 'Users & access']] : []), ['data', 'Import & backup'], ['cloud', S.mode === 'cloud' ? 'Cloud connection' : 'Move to cloud'], ['help', 'Help']];
  const tab = S.params.tab || S.ui.stab || 'company';
  const locked = !isAdmin() && !['help'].includes(tab);
  const body = locked ? `<div class="panel"><div class="empty"><b>Only admins can change settings</b>You’re signed in as ${esc(myRole())}.</div></div>` : (SETTINGS_TABS[tab] || SETTINGS_TABS.company)();
  const html = `<div class="settings"><nav class="stabs">${tabs.map(([k, l]) => `<button data-stab="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('')}</nav><div>${body.html || body}</div></div>`;
  const after = () => {
    $$('[data-stab]').forEach(b => b.onclick = () => { S.ui.stab = b.dataset.stab; saveUI(); S.params.tab ? go('settings') : render(); });
    if (!locked) body.after?.();
  };
  return { title: 'Settings', sub: S.mode === 'cloud' ? 'Shared cloud workspace' : 'Trial workspace on this device', html, after };
}
const sField = (key, label, val, type = 'text', hint = '', extra = '') => `<div class="field"><label for="s_${key}">${esc(label)}</label><input id="s_${key}" data-set="${key}" type="${type}" value="${esc(val ?? '')}" ${type === 'number' ? 'step="any"' : ''} ${extra}>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
function wireSettingInputs() {
  $$('[data-set]').forEach(el => el.addEventListener('change', async () => {
    const k = el.dataset.set; let v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? num(el.value) : el.value.trim();
    if (k.includes('.')) { const [a, b] = k.split('.'); v = { ...(S.settings[a] || {}), [b]: v }; try { await DB.setSetting(a, v); applySettings(); toast('Saved.'); } catch (e) { fail(e); } return; }
    try { await DB.setSetting(k, v); applySettings(); toast('Saved.'); if (['company_name', 'app_title', 'currency'].includes(k)) render(); } catch (e) { fail(e); }
  }));
}

function showConnect(fromApp) {
  const html = `<h2>Connect your cloud database</h2>
    <ol class="steps" style="font-size:14px;color:var(--muted)"><li>Create a free project at <a href="https://supabase.com" target="_blank" rel="noopener">supabase.com</a>.</li><li>In <b>SQL Editor → New query</b>, paste the setup script and press <b>Run</b>. <button type="button" class="btn sm" id="cpsql">Copy setup script</button></li><li>Press <b>Connect</b> at the top of the Supabase dashboard (or Project Settings → API Keys) and paste the Project URL and publishable key below.</li></ol>
    <form id="cf"><div class="field"><label for="cu">Project URL</label><input id="cu" placeholder="https://abcdefgh.supabase.co" required></div>
    <div class="field" style="margin-top:12px"><label for="ck">Publishable key</label><input id="ck" placeholder="sb_publishable_…  (or the legacy anon key eyJ…)" required><div class="hint">Settings → API Keys. Never paste the secret key here.</div></div>
    <p id="cerr" class="muted" style="color:var(--red);min-height:1.2em"></p>
    <div class="row"><button type="button" class="btn" id="cback">Back</button><span class="spacer"></span><button class="btn pri" id="cgo">Test and connect</button></div></form>`;
  if (fromApp) openModal(html); else $('#app').innerHTML = `<div class="gate">${gateArt('One shared tracker for the whole shop.', 'Your data is stored in your own free Supabase project. Only people you approve can see or change it.')}<div class="form">${html}</div></div>`;
  $('#cpsql').onclick = () => { navigator.clipboard?.writeText(SETUP_SQL).then(() => toast('Setup script copied — paste it in the Supabase SQL editor.')).catch(() => { openModal(`<h2>Setup script</h2><pre class="code">${esc(SETUP_SQL)}</pre><button class="btn" onclick="closeOverlay()">Close</button>`); }); };
  $('#cback').onclick = () => fromApp ? closeOverlay() : showWelcome();
  $('#cf').onsubmit = async e => {
    e.preventDefault(); const url = $('#cu').value.trim().replace(/\/+$/, ''), key = $('#ck').value.trim(); const err = $('#cerr');
    if (!/^https:\/\/.+/.test(url)) { err.textContent = 'The Project URL starts with https://'; return; }
    if (/^sb_secret_/.test(key) || /service_role/.test((() => { try { return atob(key.split('.')[1]); } catch { return ''; } })())) { err.textContent = 'That is the SECRET key — it must never go in a web page. Copy the publishable key instead.'; return; }
    if (!window.supabase) { err.textContent = 'Couldn’t load the database library. Check your internet connection.'; return; }
    $('#cgo').disabled = true; err.textContent = 'Checking…';
    try {
      const c = window.supabase.createClient(url, key);
      const { error } = await c.from('app_settings').select('key').limit(1);
      if (error && /does not exist|schema cache|relation/i.test(error.message)) { err.textContent = 'Connected, but the tables aren’t there yet. Run the setup script in the SQL editor, then try again.'; $('#cgo').disabled = false; return; }
      if (error && /Invalid API key|JWT/i.test(error.message)) throw new Error('That key was rejected. Copy the publishable key from Settings → API Keys.');
      if (error) throw error;
      const cfg = { mode: 'cloud', url, key }; lsSet('cpt_cfg', cfg); closeOverlay(); location.hash = ''; await boot();
    } catch (x) { err.textContent = x.message || String(x); $('#cgo').disabled = false; }
  };
}

async function showLogin(cfg) {
  let brand = {};
  try { const { data } = await sb.from('app_settings').select('key,value'); (data || []).forEach(r => brand[r.key] = r.value); } catch (e) { }
  if (brand.logo) { S.settings.logo = brand.logo; applySettings(); }
  const emailOn = brand.login_email !== false, userOn = brand.login_username !== false;
  let signup = false, adminMode = false;
  const emailOk = () => emailOn || adminMode;
  const draw = () => {
    const idLabel = emailOk() && userOn ? 'Email or username' : emailOk() ? 'Email' : 'Username';
    const sub = signup ? 'Use your work email. An admin will give you access.' : !emailOk() ? 'Use the username and password your admin gave you.' : 'Welcome back.';
    $('#app').innerHTML = `<div class="gate">${gateArt(brand.company_name ? `${brand.company_name}` : 'Child parts tracker', brand.app_title ? brand.app_title + ' — sign in to see live status, alerts and your tasks.' : 'Sign in to see live status, alerts and your tasks.')}
    <div class="form">${brand.logo ? `<img src="${esc(brand.logo)}" alt="" style="width:64px;height:64px;object-fit:contain;margin-bottom:14px">` : ''}<h2>${signup ? 'Create your account' : 'Sign in'}</h2><p class="muted">${sub}</p>
      <form id="lf">${signup ? `<div class="field"><label for="ln">Your name</label><input id="ln" required autocomplete="name"></div>` : ''}
      <div class="field" style="margin-top:12px"><label for="le">${idLabel}</label><input id="le" type="${signup ? 'email' : 'text'}" required autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <div class="field" style="margin-top:12px"><label for="lp">Password</label><input id="lp" type="password" required minlength="6" autocomplete="${signup ? 'new-password' : 'current-password'}"></div>
      <p id="lerr" class="muted" style="min-height:1.2em"></p>
      <button class="btn pri" style="width:100%">${signup ? 'Create account' : 'Sign in'}</button></form>
      <div class="row" style="margin-top:14px;justify-content:space-between">${emailOk() ? `<button class="btn ghost" id="lt">${signup ? 'I already have an account' : 'Create an account'}</button>` : '<span></span>'}${signup || !emailOk() ? '' : '<button class="btn ghost" id="lr">Forgot password</button>'}</div>
      ${!emailOn && !adminMode ? '<button class="btn ghost sm" id="la" style="margin-top:14px;align-self:flex-start">Admin sign-in (email)</button>' : ''}
      ${cfg && !window.APP_CONFIG ? '<button class="btn ghost sm" id="ldc" style="margin-top:20px;align-self:flex-start">Use a different database</button>' : ''}</div></div>`;
    $('#lt')?.addEventListener('click', () => { signup = !signup; draw(); });
    $('#la')?.addEventListener('click', () => { adminMode = true; draw(); });
    $('#ldc')?.addEventListener('click', () => { localStorage.removeItem('cpt_cfg'); location.reload(); });
    $('#lr')?.addEventListener('click', async () => { const em = $('#le').value.trim(); if (!em.includes('@')) return $('#lerr').textContent = 'Enter your email first. (Username logins can’t reset by email — ask your admin.)'; const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.href.split('#')[0] }); $('#lerr').textContent = error ? error.message : 'Check your email for a reset link.'; });
    $('#lf').onsubmit = async e => {
      e.preventDefault(); const raw = $('#le').value.trim(), pw = $('#lp').value; const out = $('#lerr'); out.style.color = '';
      const bad = m => { out.style.color = 'var(--red)'; out.textContent = m; };
      let em = raw;
      if (signup) { if (!raw.includes('@')) return bad('Enter a valid email address.'); }
      else if (raw.includes('@')) { if (!emailOk()) return bad('Email sign-in is switched off. Use your username, or “Admin sign-in”.'); }
      else { if (!userOn) return bad('Username sign-in is switched off. Please use your email.'); em = userEmail(raw); }
      out.textContent = 'Please wait…';
      const r = signup ? await sb.auth.signUp({ email: em, password: pw, options: { data: { full_name: $('#ln').value.trim() }, emailRedirectTo: location.href.split('#')[0] } }) : await sb.auth.signInWithPassword({ email: em, password: pw });
      if (r.error) { return bad(/invalid login/i.test(r.error.message) ? 'Wrong username/email or password.' : r.error.message); }
      if (signup && !r.data.session) { out.textContent = 'Account created. Check your email to confirm, then sign in.'; signup = false; return; }
      location.reload();
    };
  };
  draw();
}

async function start(cfg) {
  S.mode = cfg.mode; S.cfg = cfg;
  try { await loadAll(); }
  catch (e) {
    console.error(e);
    const missing = /does not exist|schema cache|relation/i.test(e.message || '');
    $('#app').innerHTML = `<div class="gate">${gateArt('Almost there', missing ? 'The database is connected but its tables haven’t been created yet.' : 'The database couldn’t be reached.')}<div class="form"><h2>${missing ? 'Run the setup script' : 'Couldn’t load data'}</h2><p class="muted">${missing ? 'In Supabase open SQL Editor → New query, paste the script and press Run. Then reload this page.' : esc(e.message)}</p>${missing ? `<button class="btn pri" id="cps">Copy setup script</button>` : ''}<button class="btn" style="margin-top:10px" onclick="location.reload()">Reload</button></div></div>`;
    $('#cps')?.addEventListener('click', () => { navigator.clipboard?.writeText(SETUP_SQL); toast('Copied.'); });
    return;
  }
  parseHash(); render();
  if (S.mode === 'cloud') Cloud.subscribe();
  if (S.mode === 'cloud' && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  setTimeout(offerPush, 3500);
  if (S.mode === 'cloud' && isAdmin()) (async () => { try { const { count } = await sb.from('profiles').select('id', { count: 'exact', head: true }).eq('role', 'none'); if (count) toast(`${count} ${count === 1 ? 'person is' : 'people are'} waiting for access.`, [{ label: 'Review', route: 'settings?tab=access' }], 10000); } catch (e) { } })();
  if (S.mode === 'cloud' && myRole() === 'viewer' && !S.ui.viewerNote) { toast('You have view-only access. Ask an admin to change your role if you need to make changes.', [], 9000); S.ui.viewerNote = 1; saveUI(); }
  setTimeout(maybeAutoDigest, 4000);
  setTimeout(() => scanReminders().catch(e => console.warn(e)), 2500);
  setInterval(() => { if (!document.hidden) scanReminders().catch(() => { }); }, 30 * 60e3);
  setInterval(() => { if (!document.hidden) liveRefresh(); }, 5 * 60e3); // keep ageing & alerts fresh
}

async function boot() {
  document.documentElement.dataset.theme = S.ui.theme3 || 'light';
  const inv = readInvite(location.search);
  if (inv) { lsSet('cpt_cfg', inv); history.replaceState(null, '', location.pathname + location.hash); }
  const cfg = window.APP_CONFIG || lsGet('cpt_cfg', null);
  if (!cfg || !cfg.mode) return showWelcome();
  if (cfg.mode === 'local') return start(cfg);
  if (!window.supabase) { $('#app').innerHTML = `<div class="gate">${gateArt('You’re offline', 'The shared workspace needs an internet connection.')}<div class="form"><h2>Can’t reach the database</h2><p class="muted">Check your connection and try again.</p><button class="btn pri" onclick="location.reload()">Try again</button></div></div>`; return; }
  sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true } });
  S.cfg = cfg;
  const { data: { session } } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') { const p = prompt('Choose a new password (at least 6 characters)'); if (p) sb.auth.updateUser({ password: p }).then(({ error }) => toast(error ? error.message : 'Password updated.')); } });
  if (!session) return showLogin(cfg);
  S.session = session;
  const { data: prof } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  S.profile = prof || { email: session.user.email, role: 'none' };
  if (S.profile.role !== 'admin') {
    let f = {};
    try { const { data: fl } = await sb.from('app_settings').select('key,value').in('key', ['login_email', 'login_username']); (fl || []).forEach(r => f[r.key] = r.value); } catch (e) { }
    const viaUser = isUserAcct(session.user.email);
    if ((viaUser && f.login_username === false) || (!viaUser && f.login_email === false)) {
      $('#app').innerHTML = `<div class="gate">${gateArt('Sign-in switched off', viaUser ? 'Username sign-in has been switched off by your admin.' : 'Email sign-in has been switched off by your admin.')}<div class="form"><h2>Can’t sign in this way</h2><p class="muted">${viaUser ? 'Ask your admin to switch username sign-in back on.' : 'Use the username and password your admin gave you, or ask your admin to switch email sign-in back on.'}</p><button class="btn pri" id="so">Sign out</button></div></div>`;
      $('#so').onclick = async () => { await sb.auth.signOut(); location.reload(); }; return;
    }
  }
  if (S.profile.role === 'none') { $('#app').innerHTML = `<div class="gate">${gateArt('Waiting for access', 'Your account is created. An admin needs to approve it before you can see any data.')}<div class="form"><h2>Waiting for approval</h2><p class="muted">Signed in as <b>${esc(session.user.email)}</b>. Ask your admin to give you a role in Settings → Users &amp; access, then reload this page.</p><button class="btn pri" style="margin-bottom:10px" onclick="location.reload()">Reload</button><button class="btn" id="so">Sign out</button></div></div>`; $('#so').onclick = async () => { await sb.auth.signOut(); location.reload(); }; return; }
  await start(cfg);
}
window.addEventListener('DOMContentLoaded', () => boot().catch(e => { console.error(e); $('#app').innerHTML = `<div class="empty"><b>Something went wrong while starting</b>${esc(e.message)}<br><button class="btn" onclick="location.reload()">Reload</button></div>`; }));

</script>
</body>
</html>
